<h1 style="font-size:clamp(44px,6vw,80px);line-height:1.02;font-weight:700;max-width:900px">Your trail to Eagle<br>starts here.</h1>
<p style="margin:0;font-size:21px;line-height:1.5;color:#D9E2EE;max-width:640px">Every step from Life Scout to Eagle Scout, in order, with the forms you need and the people who can help. Start early, ask for help and enjoy the climb.</p>
<div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:6px"><a href="#steps" class="btn-red" style="background:#ce1126;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:17px;padding:15px 26px;border-radius:6px">See the steps</a><a href="https://cpcscouting.org/download/738/eagle/987510422/512-728_26-eagle-scout-application" style="border:2px solid #FFFFFF;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:17px;padding:13px 24px;border-radius:6px">Eagle Scout application (PDF)</a></div>
</div>

<div style="display:flex;flex-direction:column" aria-hidden="true"><span style="height:8px;background:#ce1126"></span><span style="height:5px;background:#FFFFFF"></span><span style="height:8px;background:#003366"></span></div><div style="background:#F4F1EA;border-bottom:1px solid #E4DED1"><div style="max-width:1240px;margin:0 auto;padding:16px 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center"><span style="font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#515354;margin-right:6px">Jump to</span><a href="#dates" style="color:#003366;text-decoration:none;font-weight:700;font-size:15px;padding:8px 14px;border:1px solid #D6CEBD;border-radius:999px;background:#FFFFFF">Key dates</a><a href="#steps" style="color:#003366;text-decoration:none;font-weight:700;font-size:15px;padding:8px 14px;border:1px solid #D6CEBD;border-radius:999px;background:#FFFFFF">Steps</a><a href="#project" style="color:#003366;text-decoration:none;font-weight:700;font-size:15px;padding:8px 14px;border:1px solid #D6CEBD;border-radius:999px;background:#FFFFFF">Your project</a><a href="#resources" style="color:#003366;text-decoration:none;font-weight:700;font-size:15px;padding:8px 14px;border:1px solid #D6CEBD;border-radius:999px;background:#FFFFFF">Resources</a><a href="#help" style="color:#003366;text-decoration:none;font-weight:700;font-size:15px;padding:8px 14px;border:1px solid #D6CEBD;border-radius:999px;background:#FFFFFF">Who can help</a></div></div><section id="dates" class="topo" style="background-color:#003366;color:#FFFFFF;"><div style="max-width:1240px;margin:0 auto;padding:88px 24px;display:flex;flex-direction:column;gap:36px"><div style="display:flex;flex-direction:column;gap:12px;max-width:780px"><span style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#FFFFFF"><svg width="16" height="16" viewBox="0 0 24 24" fill="#ce1126" aria-hidden="true"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.5l7.1-.6z"></path></svg>Be prepared</span><h2 style="font-size:46px;line-height:1.04;color:#FFFFFF">Know your key dates</h2><p style="margin:0;font-size:19px;line-height:1.55;color:#D9E2EE">Plan backward from your 18th birthday so nothing sneaks up on you.</p></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px"><div style="display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3)"><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:40px;font-weight:700;line-height:1;color:#FFFFFF">Before 18</span><span style="font-size:15px;line-height:1.5;color:#D9E2EE">Finish every requirement before your 18th birthday. Don’t wait until the last minute.</span></div><div style="display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3)"><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:40px;font-weight:700;line-height:1;color:#FFFFFF">2–4+ months</span><span style="font-size:15px;line-height:1.5;color:#D9E2EE">A typical Eagle project, start to finish. Usually longer.</span></div><div style="display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3)"><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:40px;font-weight:700;line-height:1;color:#FFFFFF">1 month</span><span style="font-size:15px;line-height:1.5;color:#D9E2EE">Ask for reference letters at least a month before your board of review.</span></div><div style="display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3)"><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:40px;font-weight:700;line-height:1;color:#FFFFFF">2–3 weeks</span><span style="font-size:15px;line-height:1.5;color:#D9E2EE">Rank is official 2–3 business days after your board; the certificate follows in 2–3 weeks.</span></div></div><p style="margin:0;font-size:15px;color:#D9E2EE">Going for the NESA Glenn A. and Melinda W. Adams Service Project of the Year Award? Applications are due <b style="color:#FFFFFF">January 31</b>.</p></div></section><section id="steps" style="background-color:#F4F1EA;"><div style="max-width:1240px;margin:0 auto;padding:88px 24px;display:flex;flex-direction:column;gap:36px"><div style="display:flex;flex-direction:column;gap:12px;max-width:780px"><span style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#ce1126"><svg width="16" height="16" viewBox="0 0 24 24" fill="#ce1126" aria-hidden="true"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.5l7.1-.6z"></path></svg>The trail</span><h2 style="font-size:46px;line-height:1.04;color:#003366">Ten steps from Life to Eagle</h2><p style="margin:0;font-size:19px;line-height:1.55;color:#515354">Some steps happen in order; others you can start early.</p></div><div style="max-width:920px;display:flex;flex-direction:column"><div style="display:grid;grid-template-columns:72px 1fr;gap:20px;position:relative">
<div style="display:flex;flex-direction:column;align-items:center"><span aria-hidden="true" style="flex:none;width:64px;height:64px;border-radius:50%;background:#003366;border:3px solid #FFFFFF;box-shadow:0 8px 18px rgba(0,20,51,.22);display:flex;align-items:center;justify-content:center"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg></span><span aria-hidden="true" style="flex:1;width:3px;background:#D6CEBD;margin-top:8px;min-height:24px"></span></div>
<div style="background:#FFFFFF;border:1px solid #E4DED1;border-left:5px solid #003366;border-radius:12px;padding:20px 24px;margin-bottom:22px;display:flex;flex-direction:column;gap:8px">
<span style="font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#ce1126">Step 1</span>
<span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:26px;font-weight:700;text-transform:uppercase;color:#003366;line-height:1.05">Read up early</span>
<div style="font-size:16px;line-height:1.6;display:flex;flex-direction:column;gap:8px"><span>Review this page as soon as you reach Life. Keep every contact with adults Youth Protection-safe: a registered leader or parent copied on emails, calls, texts and social media.</span></div></div></div><div style="display:grid;grid-template-columns:72px 1fr;gap:20px;position:relative">
<div style="display:flex;flex-direction:column;align-items:center"><span aria-hidden="true" style="flex:none;width:64px;height:64px;border-radius:50%;background:#ce1126;border:3px solid #FFFFFF;box-shadow:0 8px 18px rgba(0,20,51,.22);display:flex;align-items:center;justify-content:center"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM8.5 12l2 2 4-4M8.5 17.5h7"/></svg></span><span aria-hidden="true" style="flex:1;width:3px;background:#D6CEBD;margin-top:8px;min-height:24px"></span></div>
<div style="background:#FFFFFF;border:1px solid #E4DED1;border-left:5px solid #ce1126;border-radius:12px;padding:20px 24px;margin-bottom:22px;display:flex;flex-direction:column;gap:8px">
<span style="font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#ce1126">Step 2</span>
<span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:26px;font-weight:700;text-transform:uppercase;color:#003366;line-height:1.05">Prepare your journey</span>
<div style="font-size:16px;line-height:1.6;display:flex;flex-direction:column;gap:8px"><ul style="margin:0;padding-left:20px;font-size:16px;line-height:1.65;display:flex;flex-direction:column;gap:4px"><li>You can start Eagle-required merit badges before you reach Life.</li><li>Review the current Eagle requirements in Scoutbook and use it to pre-fill your application.</li><li>The name on your application is the name on your certificate.</li><li>Type your application so it’s easy to read.</li></ul></div></div></div><div style="display:grid;grid-template-columns:72px 1fr;gap:20px;position:relative">
<div style="display:flex;flex-direction:column;align-items:center"><span aria-hidden="true" style="flex:none;width:64px;height:64px;border-radius:50%;background:#243E2C;border:3px solid #FFFFFF;box-shadow:0 8px 18px rgba(0,20,51,.22);display:flex;align-items:center;justify-content:center"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.8 3.5-5.5 6.5-5.5s5.7 1.7 6.5 5.5"/><path d="M15.5 4.8a3.3 3.3 0 0 1 0 6.4M18 14.8c1.8.7 3 2.4 3.5 5.2"/></svg></span><span aria-hidden="true" style="flex:1;width:3px;background:#D6CEBD;margin-top:8px;min-height:24px"></span></div>
<div style="background:#FFFFFF;border:1px solid #E4DED1;border-left:5px solid #243E2C;border-radius:12px;padding:20px 24px;margin-bottom:22px;display:flex;flex-direction:column;gap:8px">
<span style="font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#ce1126">Step 3</span>
<span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:26px;font-weight:700;text-transform:uppercase;color:#003366;line-height:1.05">Find an Eagle mentor</span>
<div style="font-size:16px;line-height:1.6;display:flex;flex-direction:column;gap:8px"><span>Highly recommended. Ask your unit leader to help you find one. Mentors advise and guide; they never do your work or make your decisions. <b>Two-deep leadership</b> applies to every meeting, call, email and text.</span></div></div></div><div style="display:grid;grid-template-columns:72px 1fr;gap:20px;position:relative">
<div style="display:flex;flex-direction:column;align-items:center"><span aria-hidden="true" style="flex:none;width:64px;height:64px;border-radius:50%;background:#ff6200;border:3px solid #FFFFFF;box-shadow:0 8px 18px rgba(0,20,51,.22);display:flex;align-items:center;justify-content:center"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))"><path d="M13 7 6.5 13.5l4 4L17 11"/><path d="M14 4l6 6-2 2-6-6zM6.5 13.5 3 20l1 1 6.5-3.5"/></svg></span><span aria-hidden="true" style="flex:1;width:3px;background:#D6CEBD;margin-top:8px;min-height:24px"></span></div>
<div style="background:#FFFFFF;border:1px solid #E4DED1;border-left:5px solid #ff6200;border-radius:12px;padding:20px 24px;margin-bottom:22px;display:flex;flex-direction:column;gap:8px">
<span style="font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#ce1126">Step 4</span>
<span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:26px;font-weight:700;text-transform:uppercase;color:#003366;line-height:1.05">Plan &amp; complete your project</span>
<div style="font-size:16px;line-height:1.6;display:flex;flex-direction:column;gap:8px"><span>Use only the current <a href="https://www.scouting.org/programs/scouts-bsa/advancement-and-awards/eagle-scout-workbook/">Eagle Scout Service Project Workbook</a>. Get your proposal approved <b>before</b> work begins, and your fundraising application approved <b>before</b> you raise money. Details below.</span></div></div></div><div style="display:grid;grid-template-columns:72px 1fr;gap:20px;position:relative">
<div style="display:flex;flex-direction:column;align-items:center"><span aria-hidden="true" style="flex:none;width:64px;height:64px;border-radius:50%;background:#003366;border:3px solid #FFFFFF;box-shadow:0 8px 18px rgba(0,20,51,.22);display:flex;align-items:center;justify-content:center"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 15h6M9 18h3"/></svg></span><span aria-hidden="true" style="flex:1;width:3px;background:#D6CEBD;margin-top:8px;min-height:24px"></span></div>
<div style="background:#FFFFFF;border:1px solid #E4DED1;border-left:5px solid #003366;border-radius:12px;padding:20px 24px;margin-bottom:22px;display:flex;flex-direction:column;gap:8px">
<span style="font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#ce1126">Step 5</span>
<span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:26px;font-weight:700;text-transform:uppercase;color:#003366;line-height:1.05">Turn in your paperwork</span>
<div style="font-size:16px;line-height:1.6;display:flex;flex-direction:column;gap:8px"><ul style="margin:0;padding-left:20px;font-size:16px;line-height:1.65;display:flex;flex-direction:column;gap:4px"><li>Put your completed project workbook, Eagle rank application and Letter of Ambition in a binder (sheet protectors optional).</li><li>Submit the signed rank application with your project report to the Scout Office, on the current form from Scouting.org.</li><li>Make sure Scoutbook dates match your application to avoid delays.</li><li><b>Letter of Ambition:</b> your ambitions and life purpose, plus leadership positions and honors.</li></ul></div></div></div><div style="display:grid;grid-template-columns:72px 1fr;gap:20px;position:relative">
<div style="display:flex;flex-direction:column;align-items:center"><span aria-hidden="true" style="flex:none;width:64px;height:64px;border-radius:50%;background:#ce1126;border:3px solid #FFFFFF;box-shadow:0 8px 18px rgba(0,20,51,.22);display:flex;align-items:center;justify-content:center"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))"><path d="M4 5h16v10H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg></span><span aria-hidden="true" style="flex:1;width:3px;background:#D6CEBD;margin-top:8px;min-height:24px"></span></div>
<div style="background:#FFFFFF;border:1px solid #E4DED1;border-left:5px solid #ce1126;border-radius:12px;padding:20px 24px;margin-bottom:22px;display:flex;flex-direction:column;gap:8px">
<span style="font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#ce1126">Step 6</span>
<span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:26px;font-weight:700;text-transform:uppercase;color:#003366;line-height:1.05">Eagle board of review</span>
<div style="font-size:16px;line-height:1.6;display:flex;flex-direction:column;gap:8px"><span>Once the Scout Office verifies your application, your district will contact you to schedule a board of review. Boards are usually held monthly. Ask for reference letters a month ahead, addressed to your District Advancement Chair; don’t collect or read them yourself.</span></div></div></div><div style="display:grid;grid-template-columns:72px 1fr;gap:20px;position:relative">
<div style="display:flex;flex-direction:column;align-items:center"><span aria-hidden="true" style="flex:none;width:64px;height:64px;border-radius:50%;background:#243E2C;border:3px solid #FFFFFF;box-shadow:0 8px 18px rgba(0,20,51,.22);display:flex;align-items:center;justify-content:center"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5"/></svg></span><span aria-hidden="true" style="flex:1;width:3px;background:#D6CEBD;margin-top:8px;min-height:24px"></span></div>
<div style="background:#FFFFFF;border:1px solid #E4DED1;border-left:5px solid #243E2C;border-radius:12px;padding:20px 24px;margin-bottom:22px;display:flex;flex-direction:column;gap:8px">
<span style="font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#ce1126">Step 7</span>
<span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:26px;font-weight:700;text-transform:uppercase;color:#003366;line-height:1.05">Court of honor</span>
<div style="font-size:16px;line-height:1.6;display:flex;flex-direction:column;gap:8px"><span>Plan your ceremony after the National Advancement Committee confirms your approval. NESA has <a href="https://eagles.ggacbsa.org/wp-content/uploads/2022/05/EagleCeremonyBooklet11.16.17-3.pdf">suggested ceremonies</a> to make it memorable.</span></div></div></div><div style="display:grid;grid-template-columns:72px 1fr;gap:20px;position:relative">
<div style="display:flex;flex-direction:column;align-items:center"><span aria-hidden="true" style="flex:none;width:64px;height:64px;border-radius:50%;background:#ff6200;border:3px solid #FFFFFF;box-shadow:0 8px 18px rgba(0,20,51,.22);display:flex;align-items:center;justify-content:center"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg></span><span aria-hidden="true" style="flex:1;width:3px;background:#D6CEBD;margin-top:8px;min-height:24px"></span></div>
<div style="background:#FFFFFF;border:1px solid #E4DED1;border-left:5px solid #ff6200;border-radius:12px;padding:20px 24px;margin-bottom:22px;display:flex;flex-direction:column;gap:8px">
<span style="font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#ce1126">Step 8</span>
<span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:26px;font-weight:700;text-transform:uppercase;color:#003366;line-height:1.05">Share your story</span>
<div style="font-size:16px;line-height:1.6;display:flex;flex-direction:column;gap:8px"><ul style="margin:0;padding-left:20px;font-size:16px;line-height:1.65;display:flex;flex-direction:column;gap:4px"><li>Add your project to the council’s Eagle Project Map.</li><li>Tell your story on The CPC Scouting Expedition podcast: email <a href="mailto:podcast@cpcscouting.org?subject=My%20Eagle%20Project">podcast@cpcscouting.org</a>.</li><li>Submit your project to Scout Life’s Eagle Project Showcase.</li><li>Apply for NESA’s Glenn A. and Melinda W. Adams Service Project of the Year (NESA membership not required).</li></ul></div></div></div><div style="display:grid;grid-template-columns:72px 1fr;gap:20px;position:relative">
<div style="display:flex;flex-direction:column;align-items:center"><span aria-hidden="true" style="flex:none;width:64px;height:64px;border-radius:50%;background:#003366;border:3px solid #FFFFFF;box-shadow:0 8px 18px rgba(0,20,51,.22);display:flex;align-items:center;justify-content:center"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5M22 9v6"/></svg></span><span aria-hidden="true" style="flex:1;width:3px;background:#D6CEBD;margin-top:8px;min-height:24px"></span></div>
<div style="background:#FFFFFF;border:1px solid #E4DED1;border-left:5px solid #003366;border-radius:12px;padding:20px 24px;margin-bottom:22px;display:flex;flex-direction:column;gap:8px">
<span style="font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#ce1126">Step 9</span>
<span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:26px;font-weight:700;text-transform:uppercase;color:#003366;line-height:1.05">Look for scholarships</span>
<div style="font-size:16px;line-height:1.6;display:flex;flex-direction:column;gap:8px"><span>Many organizations offer Eagle Scout scholarships, and offerings change often. Start with our <a href="https://cpcscouting.org/eagle-scout-alumni-association/eagle-scout-scholarships/">Eagle Scout scholarships</a>.</span></div></div></div><div style="display:grid;grid-template-columns:72px 1fr;gap:20px;position:relative">
<div style="display:flex;flex-direction:column;align-items:center"><span aria-hidden="true" style="flex:none;width:64px;height:64px;border-radius:50%;background:#ce1126;border:3px solid #FFFFFF;box-shadow:0 8px 18px rgba(0,20,51,.22);display:flex;align-items:center;justify-content:center"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))"><path d="M2 9c4 0 6 1 8 3 1-3 3-5 6-5 2 0 4 1 6 3-3 0-4 1-5 3l-2 4-3 2v3l-2-2-3 1 1-3c-3-1-5-4-6-9z"/><circle cx="16.5" cy="9.5" r=".7"/></svg></span><span aria-hidden="true" style="flex:1;width:3px;background:#D6CEBD;margin-top:8px;min-height:24px"></span></div>
<div style="background:#FFFFFF;border:1px solid #E4DED1;border-left:5px solid #ce1126;border-radius:12px;padding:20px 24px;margin-bottom:22px;display:flex;flex-direction:column;gap:8px">
<span style="font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#ce1126">Step 10</span>
<span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:26px;font-weight:700;text-transform:uppercase;color:#003366;line-height:1.05">Stay an Eagle for life</span>
<div style="font-size:16px;line-height:1.6;display:flex;flex-direction:column;gap:8px"><span>Join NESA and the CPC Eagle Scout Alumni Association, and help future Eagles through the <a href="https://cpcscouting.org/eagle-scout-alumni-association/eagle-scout-association-ways-to-give/">Eagle Scout Scholarship fund</a>.</span><a href="EagleAlumni.html" style="font-weight:700">Eagle Scout alumni →</a></div></div></div></div></div></section><section id="project"><div style="max-width:1240px;margin:0 auto;padding:88px 24px;display:flex;flex-direction:column;gap:36px"><div style="display:flex;flex-direction:column;gap:12px;max-width:780px"><span style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#ce1126"><svg width="16" height="16" viewBox="0 0 24 24" fill="#ce1126" aria-hidden="true"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.5l7.1-.6z"></path></svg>Plan it. Lead it. Own it.</span><h2 style="font-size:46px;line-height:1.04;color:#003366">Your Eagle project</h2><p style="margin:0;font-size:19px;line-height:1.55;color:#515354">Most projects fall into one of four categories. Write in ink or type; no pencil.</p></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px"><figure style="margin:0;display:flex;flex-direction:column;gap:10px"><img class="ph" src="assets/719baba2dd967ad57059ccc91e37ca5d.jpg" alt="A memorial bench honoring a local veteran" loading="lazy" style="width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px"><figcaption style="font-size:15px;color:#515354;line-height:1.45">A memorial bench honoring a local veteran</figcaption></figure><figure style="margin:0;display:flex;flex-direction:column;gap:10px"><img class="ph" src="assets/ebda6c598790d9d66853d194c884ae1d.jpg" alt="Eagle projects have been building our communities for generations" loading="lazy" style="width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px"><figcaption style="font-size:15px;color:#515354;line-height:1.45">Eagle projects have been building our communities for generations</figcaption></figure></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px"><div class="topo" style="background-color:#243E2C;border-radius:12px;padding:22px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;color:#FFFFFF"><span aria-hidden="true" style="flex:none;width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);box-shadow:0 10px 24px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center"><svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))"><path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15"/><path d="M5 19c3-5 6-8 10-10"/></svg></span><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:26px;font-weight:700;text-transform:uppercase">Conservation</span></div><div class="topo" style="background-color:#ff6200;border-radius:12px;padding:22px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;color:#FFFFFF"><span aria-hidden="true" style="flex:none;width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);box-shadow:0 10px 24px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center"><svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))"><path d="M13 7 6.5 13.5l4 4L17 11"/><path d="M14 4l6 6-2 2-6-6zM6.5 13.5 3 20l1 1 6.5-3.5"/></svg></span><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:26px;font-weight:700;text-transform:uppercase">Construction</span></div><div class="topo" style="background-color:#003366;border-radius:12px;padding:22px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;color:#FFFFFF"><span aria-hidden="true" style="flex:none;width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);box-shadow:0 10px 24px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center"><svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))"><path d="M3 8l9-5 9 5v9l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v9"/></svg></span><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:26px;font-weight:700;text-transform:uppercase">Collection</span></div><div class="topo" style="background-color:#ce1126;border-radius:12px;padding:22px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;color:#FFFFFF"><span aria-hidden="true" style="flex:none;width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);box-shadow:0 10px 24px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center"><svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))"><path d="M14.5 4.5 19.5 9.5 10 19H5v-5z"/><path d="M12.5 6.5l5 5"/></svg></span><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:26px;font-weight:700;text-transform:uppercase">Creative</span></div></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px"><div style="background:#FFFFFF;border:1px solid #E4DED1;border-top:5px solid #ce1126;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:8px"><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:22px;font-weight:700;text-transform:uppercase;color:#003366">Proposal</span><span style="font-size:15px;line-height:1.55">Approved by your unit leader, unit committee, the beneficiary and your district <b>before any work begins</b>.</span></div><div style="background:#FFFFFF;border:1px solid #E4DED1;border-top:5px solid #ff6200;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:8px"><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:22px;font-weight:700;text-transform:uppercase;color:#003366">Fundraising application</span><span style="font-size:15px;line-height:1.55">Needed for fundraising or in-kind donations, approved <b>before fundraising starts</b>. Small fundraisers like bake sales or car washes may not need it; ask your mentor.</span></div><div style="background:#FFFFFF;border:1px solid #E4DED1;border-top:5px solid #003366;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:8px"><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:22px;font-weight:700;text-transform:uppercase;color:#003366">Plan</span><span style="font-size:15px;line-height:1.55">Detailed, reviewed by your coach or unit and shared with the beneficiary. Approval isn’t required, but the beneficiary may want it. Consider giving a copy to your board.</span></div><div style="background:#FFFFFF;border:1px solid #E4DED1;border-top:5px solid #243E2C;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:8px"><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:22px;font-weight:700;text-transform:uppercase;color ="font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#ce1126">Once an Eagle, always an Eagle</span><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:24px;font-weight:700;text-transform:uppercase;color:#003366;line-height:1.1">Join a lifelong network</span><span style="font-size:16px;line-height:1.6">After your court of honor, join 15,000+ Eagle Scouts from our council through NESA and the CPC Eagle Scout Alumni Association.</span><a href="EagleAlumni.html" style="font-weight:700">Eagle Scout alumni →</a></div></div></div></div></section><section id="help"><div style="max-width:1240px;margin:0 auto;padding:64px 24px;display:flex;flex-direction:column;gap:22px"><div style="display:flex;flex-direction:column;gap:12px;max-width:780px"><span style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#ce1126"><svg width="16" height="16" viewBox="0 0 24 24" fill="#ce1126" aria-hidden="true"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.5l7.1-.6z"></path></svg>Key contacts</span><h2 style="font-size:46px;line-height:1.04;color:#003366">Who can help</h2><p style="margin:0;font-size:19px;line-height:1.55;color:#515354">Your unit leader and Eagle mentor come first. For anything else, reach out.</p></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px"><div style="background:#FFFFFF;border:1px solid #E4DED1;border-top:5px solid #ce1126;border-radius:12px;padding:20px;display:flex;gap:16px;align-items:center"><span style="display:contents"><img src="assets/8d265ff78b305b54b2d07ab7957abb45.jpg" alt="Michelle Baumann" style="flex:none;width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid #D6CEBD"></span><div style="display:flex;flex-direction:column;gap:3px;min-width:0"><span style="font-weight:700;font-size:18px;color:#003366">Michelle Baumann</spa <script>
DC.register("__page", function () {

  renderVals() {
return {};
  }

DC.register("FixThisPage", function () {

class Component extends DCLogic {
  componentDidMount() {
    let vol = false;
    try {
      const q = new URLSearchParams(window.location.search);
      if (q.get('volunteer') === 'fix') window.localStorage.setItem('cpc-fix-volunteer', String(Date.now() + 90 * 864e5));
      if (q.get('volunteer') === 'off') window.localStorage.removeItem('cpc-fix-volunteer');
      const until = Number(window.localStorage.getItem('cpc-fix-volunteer') || 0);
      vol = until > Date.now();
      const saved = JSON.parse(window.localStorage.getItem('cpc-fix-who') || '{}');
      this.setState({ who: saved.who || '', email: saved.email || '' });
    } catch (e) {}
    this.setState({ vol: vol });
    this.onKey = (e) => { if (e.altKey && e.shiftKey && (e.key === 'E' || e.key === 'e' || e.code === 'KeyE')) { e.preventDefault(); this.toggleVol(); } };
    try { document.addEventListener('keydown', this.onKey); } catch (e) {}
  }
  componentWillUnmount() { this.stopPoint(); try { document.removeEventListener('keydown', this.onKey); } catch (e) {} }
  toggleVol() {
    const on = !(this.state && this.state.vol);
    try { if (on) window.localStorage.setItem('cpc-fix-volunteer', String(Date.now() + 90 * 864e5)); else window.localStorage.removeItem('cpc-fix-volunteer'); } catch (e) {}
    this.setState({ vol: on, mode: on ? (this.state.mode || 'idle') : 'idle' });
  }
  pageInfo() {
    let title = 'This page', url = '';
    try {
      const h1 = Array.prototype.find.call(document.querySelectorAll('h1'), (h) => !(h.closest && h.closest('[data-fix-ui]')));
      title = (h1 && h1.innerText.replace(/\s+/g, ' ').trim()) || document.title || title;
      url = window.location.href;
    } catch (e) {}
    return { title: title.slice(0, 90), url: url };
  }
  describe(el) {
    const txt = (el.getAttribute && (el.getAttribute('alt') || el.getAttribute('aria-label'))) || el.innerText || '';
    const kind = { IMG: 'Photo', A: 'Link', H1: 'Headline', H2: 'Heading', H3: 'Heading', LI: 'List item', P: 'Paragraph', BUTTON: 'Button', FIGURE: 'Photo', IFRAME: 'Embedded calendar/form' }[el.tagName] || 'Section';
    const t = txt.replace(/\s+/g, ' ').trim();
    let section = '';
    let s = el.closest ? el.closest('section') : null;
    if (s) { const h = s.querySelector('h1,h2'); if (h) section = 'In “' + h.innerText.replace(/\s+/g, ' ').trim().slice(0, 60) + '”'; }
    const path = [];
    let n = el;
    while (n && n.tagName && n.tagName !== 'BODY' && path.length < 4) { path.unshift(n.tagName.toLowerCase() + (n.id ? '#' + n.id : '')); n = n.parentElement; }
    return { label: kind + (t ? ': “' + t.slice(0, 80) + (t.length > 80 ? '…”' : '”') : ''), section: section || 'Main content', path: path.join(' > ') };
  }
  startPointing() {
    this.stopPoint();
    const pickable = 'img,figure,a,h1,h2,h3,li,p,button,iframe,code,section';
    this.over = (e) => {
      if (e.target.closest && e.target.closest('[data-fix-ui]')) return;
      const el = e.target.closest ? e.target.closest(pickable) : null;
      if (!el || el === this.hot) return;
      this.unhot();
      this.hot = el; this.hotOld = [el.style.outline, el.style.outlineOffset, el.style.cursor];
      el.style.outline = '3px solid #ce1126'; el.style.outlineOffset = '3px'; el.style.cursor = 'crosshair';
    };
    this.click = (e) => {
      if (e.target.closest && e.target.closest('[data-fix-ui]')) return;
      e.preventDefault(); e.stopPropagation();
      const el = (e.target.closest && e.target.closest(pickable)) || e.target;
      const d = this.describe(el);
      this.unhot(); this.stopPoint();
      this.setState({ mode: 'form', target: d });
    };
    try { document.addEventListener('mouseover', this.over, true); document.addEventListener('click', this.click, true); } catch (e) {}
  }
  unhot() { if (this.hot) { const o = this.hotOld || []; this.hot.style.outline = o[0] || ''; this.hot.style.outlineOffset = o[1] || ''; this.hot.style.cursor = o[2] || ''; this.hot = null; } }
  stopPoint() { this.unhot(); try { if (this.over) document.removeEventListener('mouseover', this.over, true); if (this.click) document.removeEventListener('click', this.click, true); } catch (e) {} this.over = null; this.click = null; }
  renderVals() {
    const st = this.state || {};
    const isDemo = !this.props.embedded;
    const mode = st.mode || 'idle';
    const pub = !!st.pub;
    const info = this.pageInfo();
    const T = pub ? ['Something’s wrong', 'Broken link', 'Out of date', 'Hard to find', 'Other'] : ['Typo / wording', 'Outdated date or info', 'Broken link', 'New or replace photo', 'New or replace PDF', 'Something else'];
    const type = st.type || '';
    const urg = st.urg || 'This week';
    const chip = (on) => 'font-family:inherit;font-size:14px;font-weight:600;padding:8px 12px;border-radius:999px;cursor:pointer;border:2px solid ' + (on ? '#003366' : '#D6CEBD') + ';background:' + (on ? '#003366' : '#FFFFFF') + ';color:' + (on ? '#FFFFFF' : '#1F2933');
    const files = st.files || [];
    const tgt = st.target || { label: 'The whole page', section: info.title, path: 'page' };
    const can = !!(type && (st.text || '').trim().length > 3);
    const saveWho = (patch) => { const nw = Object.assign({ who: st.who || '', email: st.email || '' }, patch); try { window.localStorage.setItem('cpc-fix-who', JSON.stringify(nw)); } catch (e) {} this.setState(patch); };
    const stamp = new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    return {
      showDemo: isDemo, showBar: !isDemo && mode !== 'form' && mode !== 'sent',
      showPill: !isDemo && !!st.vol && mode === 'idle', pointing: mode === 'point',
      drawer: mode === 'form' || mode === 'sent', formOpen: mode === 'form', sent: mode === 'sent',
      volunteerForm: !pub,
      drawerTitle: pub ? 'Report a problem' : 'Fix this page',
      volunteerLabel: st.vol ? 'Turn off volunteer mode' : 'Turn on volunteer mode',
      volunteerNote: st.vol ? 'On in this browser for 90 days. Open any page in Play to see the tab.' : 'Off. Families never see the tab.',
      toggleVolunteer: () => this.toggleVol(),
      openPublic: () => { this._files = []; this.setState({ pub: true, mode: 'form', target: null, type: '', text: '', files: [], fileError: '' }); },
      startPoint: () => { this._files = []; this.setState({ pub: false, mode: 'point', target: null, type: '', text: '', files: [], fileError: '' }); this.startPointing(); },
      skipPoint: () => { this.stopPoint(); this.setState({ mode: 'form', target: null }); },
      repoint: () => { this.setState({ mode: 'point' }); this.startPointing(); },
      repointLabel: st.target ? 'Point at something else' : 'Point at a specific part',
      close: () => { this.stopPoint(); this.setState({ mode: 'idle', pub: false }); },
      again: () => { this._files = []; this.setState({ mode: pub ? 'form' : 'point', target: null, type: '', text: '', files: [], fileError: '' }); if (!pub) this.startPointing(); },
      targetLabel: tgt.label, targetSection: tgt.section, targetPath: tgt.path,
      types: T.map((l) => ({ label: l, on: type === l ? 'true' : 'false', style: chip(type === l), pick: () => this.setState({ type: l }) })),
      urg: ['Whenever', 'This week', 'Today: time-sensitive'].map((l) => ({ label: l, on: urg === l ? 'true' : 'false', style: chip(urg === l), pick: () => this.setState({ urg: l }) })),
      askLabel: pub ? 'What’s wrong?' : 'What should it say or do instead?',
      askHint: pub ? 'e.g. The registration link goes to an error page. A screenshot helps!' : 'e.g. Change “April 14” to “April 21”. Or: replace this flyer with the attached one.',
      text: st.text || '', setText: (e) => this.setState({ text: e.target.value }),
      addFiles: (e) => {
        const MAX = 5, MB = 10;
        const list = (this._files || []).slice(); let err = '';
        Array.prototype.slice.call((e.target && e.target.files) || []).forEach((f) => {
          if (list.some((g) => g.name === f.name && g.size === f.size)) return;
          if (f.size > MB * 1024 * 1024) { err = f.name + ' is over ' + MB + ' MB. Try a smaller file, or email it to the website team.'; return; }
          if (list.length >= MAX) { err = 'You can attach up to ' + MAX + ' files.'; return; }
          list.push(f);
        });
        this._files = list; try { e.target.value = ''; } catch (x) {}
        this.setState({ files: list.map((f) => ({ name: f.name, size: f.size })), fileError: err });
      },
      fileItems: files.map((f, i) => {
        const ext = ((f.name.split('.').pop() || 'file') + '').toUpperCase().slice(0, 4);
        const col = /PDF/.test(ext) ? '#ce1126' : /DOC|RTF|ODT|TXT/.test(ext) ? '#003366' : /XLS|CSV/.test(ext) ? '#243E2C' : /PPT/.test(ext) ? '#ff6200' : '#515354';
        const kb = f.size / 1024;
        return { name: f.name, ext: ext, color: col, size: kb > 1024 ? (kb / 1024).toFixed(1) + ' MB' : Math.max(1, Math.round(kb)) + ' KB', removeLabel: 'Remove ' + f.name,
          remove: () => { const l = (this._files || []).slice(); l.splice(i, 1); this._files = l; this.setState({ files: l.map((g) => ({ name: g.name, size: g.size })), fileError: '' }); } };
      }),
      hasFileError: !!st.fileError, fileError: st.fileError || '',
      who: st.who || '', email: st.email || '',
      setWho: (e) => saveWho({ who: e.target.value }), setEmail: (e) => saveWho({ email: e.target.value }),
      pageTitle: info.title, pageUrl: info.url || '(live page address)', stamp: stamp,
      cantSend: !can,
      sendStyle: 'font-family:inherit;font-size:16px;font-weight:700;padding:12px 20px;border-radius:6px;border:0;cursor:' + (can ? 'pointer' : 'not-allowed') + ';background:' + (can ? '#ce1126' : '#D6CEBD') + ';color:#FFFFFF',
      sendHint: can ? 'Goes to the website team for approval.' : 'Pick a type and describe the change.',
      submit: () => { if (!can) return; this.setState({ mode: 'sent', sentFiles: files.length, ticket: String(Math.floor(1000 + Math.random() * 9000)) }); },
      ticket: st.ticket || '', ticketFiles: st.sentFiles ? ' · ' + st.sentFiles + (st.sentFiles === 1 ? ' file' : ' files') + ' attached' : '',
      sentNote: pub ? 'Our team will take a look. Thanks for helping keep the site accurate.' : 'The website team reviews requests and approves them. You’ll get an email when the change is live.'
    };
  }
}

return Component;
});
DC.start("__page");
</script>
