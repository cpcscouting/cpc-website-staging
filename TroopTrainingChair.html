<h1 style="font-size:clamp(40px,5.6vw,72px);line-height:1.02;font-weight:700;max-width:820px">10 Essentials to Success</h1>
<p style="margin:0;font-size:21px;line-height:1.5;color:#E3EADF;max-width:640px">Every adult trained for the job they actually hold. Ensures all adult leaders are properly trained and encourages continuous leader education.</p>
<div style="display:flex;flex-wrap:wrap;gap:16px;margin-top:6px">
<a href="#essentials" class="btn-red" style="background:#ce1126;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:17px;padding:16px 28px;border-radius:6px">Start the checklist</a>

<h2 style="font-size:44px;line-height:1.05;color:#003366">Your 10 essentials</h2>
<p style="margin:0;font-size:18px;line-height:1.55;color:#515354">Straight from the Troop Program Guide. Check them off as you go, and tap "Add reminder" to put any of them on your calendar.</p>
<div style="background:#FFFFFF;border:1px solid #D6CEBD;border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:10px">
<span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:44px;font-weight:700;color:#ce1126;line-height:1">{{doneCount}} of 10</span>
<span style="font-size:15px;font-weight:600;color:#003366">{{progressLabel}}</span>
<div style="height:12px;background:#E9E9E4;border-radius:6px;overflow:hidden" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="{{doneCount}}"><div style="height:12px;background:#003366;width:{{pct}};transition:width .4s"></div></div>

</div>
<div style="background:#003366;color:#FFFFFF;border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:10px">
<span style="font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#9ab3d5">If you read nothing else</span>
<p style="margin:0;font-size:16px;line-height:1.55">No adult works with Scouts before Safeguarding Youth Training. That one is not optional and it is not yours to waive. Track every adult&#x27;s training in one list. Check it monthly in my.scouting.org. Push the youth side too: Introduction to Leadership Skills for Troops (ILST) for every new patrol leader, NYLT for the ones ready for more.</p>
</div>

<h2 style="font-size:32px;line-height:1.05;color:#003366">What is yours</h2>
<ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.5"><li>Keep the training list and report gaps at every committee meeting.</li><li>Hand each new adult this guide&#x27;s section for their role, plus the link to their position-specific training.</li><li>Organize ILST for new youth leaders after each election.</li></ul>
</div>
<div style="display:flex;flex-direction:column;gap:14px">
<h2 style="font-size:32px;line-height:1.05;color:#515354">What is not</h2>
<ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.5;color:#515354"><li>Teaching every course yourself. Your district and council run most of them.</li></ul>
<p style="margin:0;font-size:14px;color:#515354;border-left:0;background:#F4F1EA;border-radius:8px;padding:12px 14px">When a job is not yours and nobody has it, recruit someone. Do not absorb it.</p>
</div>
<div style="background:#FAF8F3;border:1px solid #D6CEBD;border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:14px">
<h2 style="font-size:32px;line-height:1.05;color:#ce1126">Your first 30 days</h2>
<ol style="margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.5"><li>Pull the troop&#x27;s training report from my.scouting.org.</li><li>Email every adult whose Safeguarding Youth Training is missing or expiring.</li><li>Find the next IOLS, Wood Badge, and NYLT dates in your council.</li></ol>
</div>
</div>

<h2 style="font-size:44px;line-height:1.05">Your guide and tools</h2>
<p style="margin:0;font-size:18px;line-height:1.55;color:#D9E2EE">Two meeting-plan tracks, a Trail to First Class finder and the Troop Mentor Tool give your troop a ready-made year. Use them as-is, or as a starting point.</p>

DC.register("__page", function () {

class Component extends DCLogic {
  componentDidMount() {
    try { const s = JSON.parse(window.localStorage.getItem('cpc-10e-troop-trainingchair') || 'null'); if (s) this.setState({ done: s }); } catch (e) {}
  }
  save(done) {
    this.setState({ done: done });
    try { window.localStorage.setItem('cpc-10e-troop-trainingchair', JSON.stringify(done)); } catch (e) {}
  }
  renderVals() {
    const ITEMS = [{"t": "Ensure all adult leaders are Youth Protection trained."}, {"t": "Encourage position-specific training for new leaders."}, {"t": "Promote advanced training like Wood Badge or NYLT staff."}, {"t": "Maintain troop training records."}, {"t": "Coordinate leader training opportunities through district/council."}, {"t": "Encourage Scouts to attend NYLT or leadership courses."}, {"t": "Provide updates at troop and committee meetings."}, {"t": "Support new parent orientation sessions."}, {"t": "Recognize leaders who complete advanced training."}, {"t": "Foster a culture of lifelong learning and mentorship."}];
    const EVENTS = [{"name": "Safeguarding Youth Training (online, renews every 12 months)", "date": "Anytime at my.Scouting.org"}, {"name": "Troop Committee Position-Specific Training (online)", "date": "Anytime in the Learn Center"}, {"name": "District Roundtable", "date": "[Monthly · date and location]"}, {"name": "University of Scouting", "date": "[Date · location]"}, {"name": "Wood Badge and NYLT courses", "date": "[Council dates]"}];
    const done = (this.state && this.state.done) || {};
    const pad = (n) => (n < 10 ? '0' : '') + n;
    const ymd = (d) => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
    const now = new Date();
    const items = ITEMS.map((it, i) => {
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 7);
      const end = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
      const cal = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent('Training Chair: ' + it.t) + '&dates=' + ymd(d) + '/' + ymd(end) + '&details=' + encodeURIComponent('From the Troop Program Guide, ' + 'Training Chair' + ' role guide.');
      const isDone = !!done[i];
      return { n: i + 1, t: it.t, cal: cal, done: isDone, pressed: isDone ? 'true' : 'false',
        boxBg: isDone ? '#003366' : '#FFFFFF', strike: isDone ? 'line-through' : 'none', op: isDone ? 0.75 : 1,
        toggle: () => { const nd = Object.assign({}, done); if (nd[i]) delete nd[i]; else nd[i] = true; this.save(nd); } };
    });
    const c = items.filter((x) => x.done).length;
    const label = c === 10 ? 'All 10 done. Your troop is set up to succeed.' : c === 0 ? 'Start with number 1.' : (10 - c) + ' to go.';
    return { items: items, events: EVENTS, doneCount: c, pct: (c * 10) + '%', progressLabel: label, reset: () => this.save({}) };
  }
}

return Component;
});
DC.register("FixThisPage", function () {

class Component extends DCLogic {
  componentDidMount() {
    let vol = false;
    try {
      const q = new URLSearchParams(window.location.search);
      if (q.get('volunteer') === 'fix') window.localStorage.setItem('cpc-fix-volunteer', String(Date.now() + 90 * 864e5));
      if (q.get('volunteer') === 'off') window.localStorage.removeItem('cpc-fix-volunteer');
      const until = Number(window.localStorage.getItem('cpc-fix-volunteer') || 0);
      vol = until > Date.now();
      const saved = JSON.parse(window.localStorage.getItem('cpc-fix-who') || '{}');
      this.setState({ who: saved.who || '', email: saved.email || '' });
    } catch (e) {}
    this.setState({ vol: vol });
    this.onKey = (e) => { if (e.altKey && e.shiftKey && (e.key === 'E' || e.key === 'e' || e.code === 'KeyE')) { e.preventDefault(); this.toggleVol(); } };
    try { document.addEventListener('keydown', this.onKey); } catch (e) {}
  }
  componentWillUnmount() { this.stopPoint(); try { document.removeEventListener('keydown', this.onKey); } catch (e) {} }
  toggleVol() {
    const on = !(this.state && this.state.vol);
    try { if (on) window.localStorage.setItem('cpc-fix-volunteer', String(Date.now() + 90 * 864e5)); else window.localStorage.removeItem('cpc-fix-volunteer'); } catch (e) {}
    this.setState({ vol: on, mode: on ? (this.state.mode || 'idle') : 'idle' });
  }
  pageInfo() {
    let title = 'This page', url = '';
    try {
      const h1 = Array.prototype.find.call(document.querySelectorAll('h1'), (h) => !(h.closest && h.closest('[data-fix-ui]')));
      title = (h1 && h1.innerText.replace(/\s+/g, ' ').trim()) || document.title || title;
      url = window.location.href;
    } catch (e) {}
    return { title: title.slice(0, 90), url: url };
  }
  describe(el) {
    const txt = (el.getAttribute && (el.getAttribute('alt') || el.getAttribute('aria-label'))) || el.innerText || '';
    const kind = { IMG: 'Photo', A: 'Link', H1: 'Headline', H2: 'Heading', H3: 'Heading', LI: 'List item', P: 'Paragraph', BUTTON: 'Button', FIGURE: 'Photo', IFRAME: 'Embedded calendar/form' }[el.tagName] || 'Section';
    const t = txt.replace(/\s+/g, ' ').trim();
    let section = '';
    let s = el.closest ? el.closest('section') : null;
    if (s) { const h = s.querySelector('h1,h2'); if (h) section = 'In “' + h.innerText.replace(/\s+/g, ' ').trim().slice(0, 60) + '”'; }
    const path = [];
    let n = el;
    while (n && n.tagName && n.tagName !== 'BODY' && path.length < 4) { path.unshift(n.tagName.toLowerCase() + (n.id ? '#' + n.id : '')); n = n.parentElement; }
    return { label: kind + (t ? ': “' + t.slice(0, 80) + (t.length > 80 ? '…”' : '”') : ''), section: section || 'Main content', path: path.join(' > ') };
  }
  startPointing() {
    this.stopPoint();
    const pickable = 'img,figure,a,h1,h2,h3,li,p,button,iframe,code,section';
    this.over = (e) => {
      if (e.target.closest && e.target.closest('[data-fix-ui]')) return;
      const el = e.target.closest ? e.target.closest(pickable) : null;
      if (!el || el === this.hot) return;
      this.unhot();
      this.hot = el; this.hotOld = [el.style.outline, el.style.outlineOffset, el.style.cursor];
      el.style.outline = '3px solid #ce1126'; el.style.outlineOffset = '3px'; el.style.cursor = 'crosshair';
    };
    this.click = (e) => {
      if (e.target.closest && e.target.closest('[data-fix-ui]')) return;
      e.preventDefault(); e.stopPropagation();
      const el = (e.target.closest && e.target.closest(pickable)) || e.target;
      const d = this.describe(el);
      this.unhot(); this.stopPoint();
      this.setState({ mode: 'form', target: d });
    };
    try { document.addEventListener('mouseover', this.over, true); document.addEventListener('click', this.click, true); } catch (e) {}
  }
  unhot() { if (this.hot) { const o = this.hotOld || []; this.hot.style.outline = o[0] || ''; this.hot.style.outlineOffset = o[1] || ''; this.hot.style.cursor = o[2] || ''; this.hot = null; } }
  stopPoint() { this.unhot(); try { if (this.over) document.removeEventListener('mouseover', this.over, true); if (this.click) document.removeEventListener('click', this.click, true); } catch (e) {} this.over = null; this.click = null; }
  renderVals() {
    const st = this.state || {};
    const isDemo = !this.props.embedded;
    const mode = st.mode || 'idle';
    const pub = !!st.pub;
    const info = this.pageInfo();
    const T = pub ? ['Something’s wrong', 'Broken link', 'Out of date', 'Hard to find', 'Other'] : ['Typo / wording', 'Outdated date or info', 'Broken link', 'New or replace photo', 'New or replace PDF', 'Something else'];
    const type = st.type || '';
    const urg = st.urg || 'This week';
    const chip = (on) => 'font-family:inherit;font-size:14px;font-weight:600;padding:8px 12px;border-radius:999px;cursor:pointer;border:2px solid ' + (on ? '#003366' : '#D6CEBD') + ';background:' + (on ? '#003366' : '#FFFFFF') + ';color:' + (on ? '#FFFFFF' : '#1F2933');
    const files = st.files || [];
    const tgt = st.target || { label: 'The whole page', section: info.title, path: 'page' };
    const can = !!(type && (st.text || '').trim().length > 3);
    const saveWho = (patch) => { const nw = Object.assign({ who: st.who || '', email: st.email || '' }, patch); try { window.localStorage.setItem('cpc-fix-who', JSON.stringify(nw)); } catch (e) {} this.setState(patch); };
    const stamp = new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    return {
      showDemo: isDemo, showBar: !isDemo && mode !== 'form' && mode !== 'sent',
      showPill: !isDemo && !!st.vol && mode === 'idle', pointing: mode === 'point',
      drawer: mode === 'form' || mode === 'sent', formOpen: mode === 'form', sent: mode === 'sent',
      volunteerForm: !pub,
      drawerTitle: pub ? 'Report a problem' : 'Fix this page',
      volunteerLabel: st.vol ? 'Turn off volunteer mode' : 'Turn on volunteer mode',
      volunteerNote: st.vol ? 'On in this browser for 90 days. Open any page in Play to see the tab.' : 'Off. Families never see the tab.',
      toggleVolunteer: () => this.toggleVol(),
      openPublic: () => { this.setState({ pub: true, mode: 'form', target: null, type: '', text: '' }); },
      startPoint: () => { this.setState({ pub: false, mode: 'point', target: null, type: '', text: '', files: [] }); this.startPointing(); },
      skipPoint: () => { this.stopPoint(); this.setState({ mode: 'form', target: null }); },
      repoint: () => { this.setState({ mode: 'point' }); this.startPointing(); },
      repointLabel: st.target ? 'Point at something else' : 'Point at a specific part',
      close: () => { this.stopPoint(); this.setState({ mode: 'idle', pub: false }); },
      again: () => { this.setState({ mode: pub ? 'form' : 'point', target: null, type: '', text: '', files: [] }); if (!pub) this.startPointing(); },
      targetLabel: tgt.label, targetSection: tgt.section, targetPath: tgt.path,
      types: T.map((l) => ({ label: l, on: type === l ? 'true' : 'false', style: chip(type === l), pick: () => this.setState({ type: l }) })),
      urg: ['Whenever', 'This week', 'Today: time-sensitive'].map((l) => ({ label: l, on: urg === l ? 'true' : 'false', style: chip(urg === l), pick: () => this.setState({ urg: l }) })),
      askLabel: pub ? 'What’s wrong?' : 'What should it say or do instead?',
      askHint: pub ? 'e.g. The registration link goes to an error page.' : 'e.g. Change “April 14” to “April 21”. Or: replace this photo with the attached one.',
      text: st.text || '', setText: (e) => this.setState({ text: e.target.value }),
      setFiles: (e) => this.setState({ files: Array.prototype.slice.call(e.target.files || []).map((f) => f.name) }),
      filesNote: files.length ? files.join(', ') : 'Photos, flyers or PDFs you want added. Webp and HEIC are fine.',
      who: st.who || '', email: st.email || '',
      setWho: (e) => saveWho({ who: e.target.value }), setEmail: (e) => saveWho({ email: e.target.value }),
      pageTitle: info.title, pageUrl: info.url || '(live page address)', stamp: stamp,
      cantSend: !can,
      sendStyle: 'font-family:inherit;font-size:16px;font-weight:700;padding:12px 20px;border-radius:6px;border:0;cursor:' + (can ? 'pointer' : 'not-allowed') + ';background:' + (can ? '#ce1126' : '#D6CEBD') + ';color:#FFFFFF',
      sendHint: can ? 'Goes to the website team for approval.' : 'Pick a type and describe the change.',
      submit: () => { if (!can) return; this.setState({ mode: 'sent', ticket: String(Math.floor(1000 + Math.random() * 9000)) }); },
      ticket: st.ticket || '',
      sentNote: pub ? 'Our team will take a look. Thanks for helping keep the site accurate.' : 'The website team reviews requests and approves them. You’ll get an email when the change is live.'
    };
  }
}

return Component;
});
DC.register("TroopRhythm", function () {

class Component extends DCLogic {
  renderVals() {
    const S = [
      ['Week 1', 'Troop meeting: learn the skill', 'Senior Patrol Leader', 0],
      ['Week 2', 'Troop meeting: practice it', 'Senior Patrol Leader', 0],

}

return Component;
});
