ether</span><span style="font-size:14px;font-weight:700">Program guide →</span></span></a><a href="http://tinyurl.com/pioneer-portal" class="card" style="position:relative;border-radius:12px;overflow:hidden;display:block;aspect-ratio:4/5;text-decoration:none"><img class="ph" src="assets/af5e8a58fcd69c526ec6f3b9b9f8af32.jpg" alt="Camp Pioneer" style="position:absolute;inset:0;height:100%"><span class="scrimb"></span><span style="position:absolute;left:18px;right:18px;bottom:18px;display:flex;flex-direction:column;gap:4px;color:#FFFFFF"><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:26px;font-weight:700;text-transform:uppercase;line-height:1">Camp Pioneer</span><span style="font-size:14px;font-weight:700">Program guide →</span></span></a></div></div></section><section style="background-color:#F4F1EA;"><div style="max-width:1240px;margin:0 auto;padding:88px 24px;display:flex;flex-direction:column;gap:36px"><div style="display:flex;flex-direction:column;gap:12px;max-width:780px"><span style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#ce1126"><svg width="16" height="16" viewBox="0 0 24 24" fill="#ce1126" aria-hidden="true"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.5l7.1-.6z"></path></svg>Plan your trip</span><h2 style="font-size:46px;line-height:1.04;color:#003366">Everything else, in one place</h2></div><div style="display:flex;flex-direction:column;gap:12px"><details style="background:#FFFFFF;border:1px solid #E4DED1;border-radius:12px;padding:0 22px"><summary style="display:flex;align-items:center;gap:12px;padding:20px 0"><span class="chev" style="color:#ce1126;font-weight:800;transition:transform .2s">›</span><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:24px;font-weight:700;text-transform:uppercase;color:#003366">Travel &amp; directions</span></summary><div style="padding:0 0 22px 26px"><ul style="margin:0;padding-left:18px;font-size:16px;line-height:1.55"><li style="margin:4px 0">Follow posted signs and double-check GPS; rural routes vary and cell service is limited near camp entrances.</li><li style="margin:4px 0">Car rentals: Scouting America discount code <b>XZNCBSA</b> at Enterprise.</li><li style="margin:4px 0">Airports: Portland (PDX) is closest; Redmond (RDM) works for Baldwin or Pioneer.</li><li style="margin:4px 0">Charter buses: Student Transportation of America (503) 387-5078; Motor Coach West (844) 343-1400.</li><li style="margin:4px 0">Early arrival: Saturday check-in 5–7 PM for a flat unit fee. Program areas are closed Saturdays.</li></ul><div style="display:flex;flex-wrap:wrap;gap:14px 22px;margin-top:10px;font-size:15px"><a href="https://maps.app.goo.gl/C5iD2AiGWiigCnPg6" style="font-weight:700">Butte Creek directions ↗</a><a href="https://maps.app.goo.gl/n6TtqyEPxeY6PqDBA" style="font-weight:700">Baldwin ↗</a><a href="https://maps.app.goo.gl/GTmppNUMErPpy9wk6" style="font-weight:700">Meriwether ↗</a><a href="https://maps.app.goo.gl/3x9thrj3DbHA8q1G6" style="font-weight:700">Pioneer ↗</a><a href="https://filestore.scouting.org/filestore/pdf/680-696(21)-SAFE-Transportation-Checklist-FPO3-5172021.pdf" style="font-weight:700">Transportation checklist ↗</a></div></div></details><details style="background:#FFFFFF;border:1px solid #E4DED1;border-radius:12px;padding:0 22px"><summary style="display:flex;align-items:center;gap:12px;padding:20px 0"><span class="chev" style="color:#ce1126;font-weight:800;transition:transform .2s">›</span><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:24px;font-weight:700;text-transform:uppercase;color:#003366">Packing</span></summary><div style="padding:0 0 22px 26px"><ul style="margin:0;padding-left:18px;font-size:16px;line-height:1.55"><li style="margin:4px 0">Label everything. Review the personal and unit lists with your patrol leaders.</li><li style="margin:4px 0">Bring the Scout Basic Essentials. Leave valuables at home.</li></ul><div style="display:flex;flex-wrap:wrap;gap:14px 22px;margin-top:10px;font-size:15px"><a href="https://scoutingevent.com/Download/492177187/OR/Suggested_Personal_Packing_List.pdf" style="font-weight:700">Personal packing list ↗</a><a href="https://scoutingevent.com/Download/492177188/OR/Suggested_Unit_Gear_Packing_List.pdf" style="font-weight:700">Unit gear list ↗</a><a href="https://scoutlife.org/outdoors/outdoorarticles/6976/scout-outdoor-essentials-checklist" style="font-weight:700">Ten Essentials ↗</a></div></div></details><details style="background:#FFFFFF;border:1px solid #E4DED1;border-radius:12px;padding:0 22px"><summary style="display:flex;align-items:center;gap:12px;padding:20px 0"><span class="chev" style="color:#ce1126;font-weight:800;transition:transform .2s">›</span><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:24px;font-weight:700;text-transform:uppercase;color:#003366">Expectations &amp; guidelines</span></summary><div style="padding:0 0 22px 26px"><ul style="margin:0;padding-left:18px;font-size:16px;line-height:1.55"><li style="margin:4px 0">The Scout Oath and Law and the Scouter Code of Conduct guide everyone at camp.</li><li style="margin:4px 0">Zero tolerance for bullying and hazing. Buddy system whenever youth are out of sight of qualified adults.</li><li style="margin:4px 0">Two registered adults 21+ at all activities, including a registered female adult 21+ when female youth attend.</li><li style="margin:4px 0">Not allowed: alcohol, drugs, personal firearms, fireworks, outside firewood, pets, drones, RVs/ATVs.</li></ul><div style="display:flex;flex-wrap:wrap;gap:14px 22px;margin-top:10px;font-size:15px"><a href="https://www.scouting.org/health-and-safety/gss/bsa-scouter-code-of-conduct/" style="font-weight:700">Scouter Code of Conduct ↗</a><a href="https://scoutingevent.com/Download/492177189/OR/ScoutsBSA_Clothing_Guidelines.pdf" style="font-weight:700">Clothing guidelines ↗</a></div></div></details><details style="background:#FFFFFF;border:1px solid #E4DED1;border-radius:12px;padding:0 22px"><summary style="display:flex;align-items:center;gap:12px;padding:20px 0"><span class="chev" style="color:#ce1126;font-weight:800;transition:transform .2s">›</span><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:24px;font-weight:700;text-transform:uppercase;color:#003366">Health &amp; safety</span></summary><div style="padding:0 0 22px 26px"><ul style="margin:0;padding-left:18px;font-size:16px;line-height:1.55"><li style="margin:4px 0">Every participant needs a Scouting America medical form signed within 12 months. Parts A, B &amp; C for Baldwin, Meriwether, Pioneer and Webelos; Parts A &amp; B for Butte Creek.</li><li style="margin:4px 0">48-hour rule: no fever, vomiting or contagious symptoms within 48 hours of arrival.</li><li style="margin:4px 0">Medications stay in original containers in the campsite lock box; life-saving meds are carried at all times.</li><li style="margin:4px 0">Swim tests happen at camp; pre-camp tests aren’t accepted.</li><li style="margin:4px 0">Abuse must be reported: local law enforcement (911 in an emergency), then your Scout Executive or the Scouts First Helpline, 1-844-726-8871. Call or text 988 for crisis support.</li></ul><div style="display:flex;flex-wrap:wrap;gap:14px 22px;margin-top:10px;font-size:15px"><a href="https://filestore.scouting.org/filestore/HealthSafety/pdf/680-001_ABC.pdf" style="font-weight:700">Medical form A, B &amp; C ↗</a><a href="https://filestore.scouting.org/filestore/HealthSafety/pdf/680-001_AB.pdf" style="font-weight:700">Medical form A &amp; B ↗</a><a href="https://www.scouting.org/health-and-safety/gss" style="font-weight:700">Guide to Safe Scouting ↗</a></div></div></details><details style="background:#FFFFFF;border:1px solid #E4DED1;border-radius:12px;padding:0 22px"><summary style="display:flex;align-items:center;gap:12px;padding:20px 0"><span class="chev" style="color:#ce1126;font-weight:800;transition:transform .2s">›</span><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:24px;font-weight:700;text-transform:uppercase;color:#003366">Special needs &amp; food</span></summary><div style="padding:0 0 22px 26px"><ul style="margin:0;padding-left:18px;font-size:16px;line-height:1.55"><li style="margin:4px 0">Note all special needs in online registration at least two weeks before arrival.</li><li style="margin:4px 0">The kitchen offers gluten-free, dairy-free and vegetarian substitutions; other restrictions bring their own food, stored in labeled containers.</li><li style="margin:4px 0">No peanuts or tree nuts are used in the kitchen.</li><li style="margin:4px 0">CPAP users bring portable batteries; charge at the dining hall during daylight.</li></ul><div style="display:flex;flex-wrap:wrap;gap:14px 22px;margin-top:10px;font-size:15px"><a href="https://scoutingevent.com/Download/492132872/OR/Special_Needs_Registration_Guide.pdf" style="font-weight:700">Special needs registration guide ↗</a></div></div></details><details style="background:#FFFFFF;border:1px solid #E4DED1;border-radius:12px;padding:0 22px"><summary style="display:flex;align-items:center;gap:12px;padding:20px 0"><span class="chev" style="color:#ce1126;font-weight:800;transition:transform .2s">›</span><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:24px;font-weight:700;text-transform:uppercase;color:#003366">Camp fees &amp; financial aid</span></summary><div style="padding:0 0 22px 26px"><ul style="margin:0;padding-left:18px;font-size:16px;line-height:1.55"><li style="margin:4px 0">Registration is a firm commitment; deposits are non-refundable. Exact fees show at registration.</li><li style="margin:4px 0">Stack discounts for up to about $150 per youth: Early Bird, Loyalty Streak and In-Council. <a href="SummerCamp.html#savings">Estimate yours</a>.</li><li style="margin:4px 0">One free adult per troop. Plan $75–$100 per youth for the trading post.</li><li style="margin:4px 0">No Scout should miss camp for money. CPC youth can apply for a campership.</li></ul><div style="display:flex;flex-wrap:wrap;gap:14px 22px;margin-top:10px;font-size:15px"><a href="https://247scouting.com/forms/492-campership" style="font-weight:700">Apply for a campership ↗</a><a href="https://scoutingevent.com/Download/492177192/OR/Summer_Camp_Payment_Schedule.pdf" style="font-weight:700">Payment schedule ↗</a><a href="https://scoutingevent.com/Download/492174715/OR/How_to_Pay_by_eCheck.pdf" style="font-weight:700">Pay by eCheck ↗</a><a href="https://247scouting.com/forms/492-refundrequest" style="font-weight:700">Refund request ↗</a></div></div></details></div></div></section><section class="topo" style="background-color:#D6CEBD"><div style="max-width:1100px;margin:0 auto;padding:64px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center">

<p style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;margin:0;font-size:clamp(30px,3.6vw,46px);line-height:1.1;font-weight:700;text-transform:uppercase;color:#003366">Be prepared.<br>It’s more than a motto.</p><p style="margin:0;font-size:18px;color:#1F2933;max-width:760px;text-align:center">It’s our promise to every family that trusts us with their Scout for a week.</p></div></section><section id="contact"><div style="max-width:1240px;margin:0 auto;padding:72px 24px;display:flex;flex-direction:column;gap:24px"><div style="display:flex;flex-direction:column;gap:12px;max-width:900px"><h2 style="font-size:46px;line-height:1.04;color:#003366">Questions? We’re here.</h2></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px">

<div style="display:flex;flex-direction:column;gap:8px">
<span style="font-weight:700;color:#003366">How soon?</span>
<div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{urg}}" as="u" hint-placeholder-count="3"><button type="button" onClick="{{u.pick}}" aria-pressed="{{u.on}}" style="{{u.style}}">{{u.label}}</button></sc-for></div>
</div>
<label style="display:flex;flex-direction:column;gap:8px;font-weight:700;color:#003366">Attach photos or PDFs (optional)
<input type="file" multiple accept="image/*,.pdf,.webp,.heic" onChange="{{setFiles}}" style="font-family:inherit;font-size:14px;font-weight:400">
<span style="font-size:13px;font-weight:400;color:#515354">{{filesNote}}</span>
</label>
</sc-if>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:#003366">Your name<input type="text" value="{{who}}" onChange="{{setWho}}" style="font-family:inherit;font-size:15px;font-weight:400;border:1px solid #D6CEBD;border-radius:8px;padding:9px 10px"></label>
<label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:#003366">Email<input type="email" value="{{email}}" onChange="{{setEmail}}" style="font-family:inherit;font-size:15px;font-weight:400;border:1px solid #D6CEBD;border-radius:8px;padding:9px 10px"></label>
</div>

<details style="font-size:13px;color:#515354"><summary style="cursor:pointer;font-weight:700">Sent automatically with your request</summary>
<div style="padding-top:8px;display:flex;flex-direction:column;gap:3px;line-height:1.45"><span>Page: {{pageTitle}}</span><span>Address: {{pageUrl}}</span><span>Section: {{targetSection}}</span><span>Element: {{targetPath}}</span><span>Time: {{stamp}}</span></div>
</details>
</div>
<div style="border-top:1px solid #E4DED1;padding:14px 20px;display:flex;align-items:center;gap:12px">
<button type="button" onClick="{{submit}}" disabled="{{cantSend}}" style="{{sendStyle}}">Send request</button>
<span style="font-size:13px;color:#515354;flex:1">{{sendHint}}</span>
</div>
<sc-if value="{{volunteerForm}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{toggleVolunteer}}" style="font-family:inherit;font-size:12px;color:#515354;background:none;border:0;padding:0 20px 14px;text-align:left;text-decoration:underline;cursor:pointer">Turn off volunteer mode in this browser</button>
</sc-if>
</sc-if>
</aside>
</sc-if>

</div>
</template>
<script src="dc-lite.js"></script>
<script>
DC.register("__page", function () {

class Component extends DCLogic {

  renderVals() {
    const st = this.state || {}; const p = st.p || 'before';
    const G = {"before": [{"title": "For leaders", "items": [{"h": "Paperwork.", "d": "Every medical form complete and signed; roster and registration confirmed."}, {"h": "Adults.", "d": "Every overnight adult registered and current on Safeguarding Youth Training."}, {"h": "Program.", "d": "Merit badge sign-ups done and prerequisites checked in the program guide."}, {"h": "Logistics.", "d": "Transportation set, payments final, arrival and departure times shared."}, {"h": "Gear check.", "d": "Hold a pack check at a meeting: Ten Essentials and real boots."}]}, {"title": "For parents", "items": [{"h": "Health form.", "d": "Parts A & B by you; Part C needs a provider signature for camps over 72 hours."}, {"h": "Packing.", "d": "Review the list and label everything."}, {"h": "Homework.", "d": "Finish any merit badge “home requirements” before camp."}, {"h": "Stay in touch.", "d": "Fill out the Parent Quick Reference and mail letters before your Scout leaves."}]}], "during": [{"title": "For leaders", "items": [{"h": "Lead from the back.", "d": "Hydration, sunscreen and check-ins. Let youth leaders run the show."}, {"h": "Cracker Barrel.", "d": "Attend the daily leaders’ meeting for schedule, weather and program updates."}, {"h": "Mid-week check.", "d": "Confirm advancement is being recorded."}, {"h": "Set the tone.", "d": "Model cleanliness, uniforming and spirit."}]}, {"title": "For parents", "items": [{"h": "No news is good news.", "d": "Assume your Scout is thriving unless the camp calls."}, {"h": "Mail is slow.", "d": "Remote camps get mail late; send letters early."}, {"h": "Visiting?", "d": "Review the visitor policy and check in at the camp office."}]}], "after": [{"title": "For leaders", "items": [{"h": "Advancement.", "d": "Verify and download records before you leave; they’re final when the session ends."}, {"h": "Gear.", "d": "Clean and fully dry everything before storage."}, {"h": "Roses & thorns.", "d": "Reflect together at the next meeting."}, {"h": "Keep momentum.", "d": "Use camp’s new skills to plan the fall outdoor schedule."}]}, {"title": "For parents", "items": [{"h": "The camp funk.", "d": "Wash everything, sleeping bag included, right away."}, {"h": "Decompress.", "d": "Water, a shower, sleep, then listen to every story."}, {"h": "Tell us.", "d": "Take the summer camp survey."}]}]}; const L = {"before": [{"t": "Planning timeline", "href": "https://scoutingevent.com/Download/492129223/OR/Summer_Camp_Planning_Timeline.pdf"}, {"t": "Class sign-ups", "href": "https://scoutingevent.com/Download/492132874/SM/Class_Sign_Up_Registration_Guide.pdf"}, {"t": "Parent portal", "href": "https://scoutingevent.com/Download/492132870/SM/Parent_Portal_Registration_Guide.pdf"}, {"t": "Parent quick reference", "href": "https://scoutingevent.com/Download/492177185/OR/Summer_Camp_Parent_Quick_Reference.pdf"}], "during": [{"t": "Camp maps: Baldwin", "href": "https://scoutingevent.com/Download/492123877/OR/Camp_Baldwin_Maps.pdf"}, {"t": "Meriwether", "href": "https://scoutingevent.com/Download/492169058/OR/Camp_Meriwether_Maps.pdf"}, {"t": "Pioneer", "href": "https://scoutingevent.com/Download/492169059/OR/Camp_Pioneer_Maps.pdf"}, {"t": "Butte Creek", "href": "https://scoutingevent.com/Download/492169057/OR/Butte_Creek_Maps.pdf"}], "after": [{"t": "Advancement records", "href": "https://scoutingevent.com/Download/492172863/SM/Scouting_Event_Guide_Advancement_Records.pdf"}, {"t": "Lost & found", "href": "https://247scouting.com/forms/492-lostandfound"}, {"t": "Summer camp survey", "href": "http://qrco.de/campsurvey"}, {"t": "Post-camp checklist", "href": "https://onscouting.org/2014/08/28/post-campout-checklist/"}]};
    const sty = (on) => 'font-family:inherit;font-size:16px;font-weight:700;padding:11px 22px;border-radius:8px;cursor:pointer;border:2px solid #003366;background:' + (on ? '#003366' : '#FFFFFF') + ';color:' + (on ? '#FFFFFF' : '#003366');
    return { tabs: [['before', 'Before camp'], ['during', 'During camp'], ['after', 'After camp']].map(([v, l]) => ({ label: l, on: p === v ? 'true' : 'false', style: sty(p === v), pick: () => this.setState({ p: v }) })), groups: G[p], links: L[p] };
  }
}

return Component;
});
DC.register("FixThisPage", function () {

class Component extends DCLogic {
  componentDidMount() {
    let vol = false;
    try {
      const q = new URLSearchParams(window.location.search);
      if (q.get('volunteer') === 'fix') window.localStorage.setItem('cpc-fix-volunteer', String(Date.now() + 90 * 864e5));
      if (q.get('volunteer') === 'off') window.localStorage.removeItem('cpc-fix-volunteer');
      const until = Number(window.localStorage.getItem('cpc-fix-volunteer') || 0);
      vol = until > Date.now();
      const saved = JSON.parse(window.localStorage.getItem('cpc-fix-who') || '{}');
      this.setState({ who: saved.who || '', email: saved.email || '' });
    } catch (e) {}
    this.setState({ vol: vol });
    this.onKey = (e) => { if (e.altKey && e.shiftKey && (e.key === 'E' || e.key === 'e' || e.code === 'KeyE')) { e.preventDefault(); this.toggleVol(); } };
    try { document.addEventListener('keydown', this.onKey); } catch (e) {}
  }
  componentWillUnmount() { this.stopPoint(); try { document.removeEventListener('keydown', this.onKey); } catch (e) {} }
  toggleVol() {
    const on = !(this.state && this.state.vol);
    try { if (on) window.localStorage.setItem('cpc-fix-volunteer', String(Date.now() + 90 * 864e5)); else window.localStorage.removeItem('cpc-fix-volunteer'); } catch (e) {}
    this.setState({ vol: on, mode: on ? (this.state.mode || 'idle') : 'idle' });
  }
  pageInfo() {
    let title = 'This page', url = '';
    try {
      const h1 = Array.prototype.find.call(document.querySelectorAll('h1'), (h) => !(h.closest && h.closest('[data-fix-ui]')));
      title = (h1 && h1.innerText.replace(/\s+/g, ' ').trim()) || document.title || title;
      url = window.location.href;
    } catch (e) {}
    return { title: title.slice(0, 90), url: url };
  }
  describe(el) {
    const txt = (el.getAttribute && (el.getAttribute('alt') || el.getAttribute('aria-label'))) || el.innerText || '';
    const kind = { IMG: 'Photo', A: 'Link', H1: 'Headline', H2: 'Heading', H3: 'Heading', LI: 'List item', P: 'Paragraph', BUTTON: 'Button', FIGURE: 'Photo', IFRAME: 'Embedded calendar/form' }[el.tagName] || 'Section';
    const t = txt.replace(/\s+/g, ' ').trim();
    let section = '';
    let s = el.closest ? el.closest('section') : null;
    if (s) { const h = s.querySelector('h1,h2'); if (h) section = 'In “' + h.innerText.replace(/\s+/g, ' ').trim().slice(0, 60) + '”'; }
    const path = [];
    let n = el;
    while (n && n.tagName && n.tagName !== 'BODY' && path.length < 4) { path.unshift(n.tagName.toLowerCase() + (n.id ? '#' + n.id : '')); n = n.parentElement; }
    return { label: kind + (t ? ': “' + t.slice(0, 80) + (t.length > 80 ? '…”' : '”') : ''), section: section || 'Main content', path: path.join(' > ') };
  }
  startPointing() {
    this.stopPoint();
    const pickable = 'img,figure,a,h1,h2,h3,li,p,button,iframe,code,section';
    this.over = (e) => {
      if (e.target.closest && e.target.closest('[data-fix-ui]')) return;
      const el = e.target.closest ? e.target.closest(pickable) : null;
      if (!el || el === this.hot) return;
      this.unhot();
      this.hot = el; this.hotOld = [el.style.outline, el.style.outlineOffset, el.style.cursor];
      el.style.outline = '3px solid #ce1126'; el.style.outlineOffset = '3px'; el.style.cursor = 'crosshair';
    };
    this.click = (e) => {
      if (e.target.closest && e.target.closest('[data-fix-ui]')) return;
      e.preventDefault(); e.stopPropagation();
      const el = (e.target.closest && e.target.closest(pickable)) || e.target;
      const d = this.describe(el);
      this.unhot(); this.stopPoint();
      this.setState({ mode: 'form', target: d });
    };
    try { document.addEventListener('mouseover', this.over, true); document.addEventListener('click', this.click, true); } catch (e) {}
  }
  unhot() { if (this.hot) { const o = this.hotOld || []; this.hot.style.outline = o[0] || ''; this.hot.style.outlineOffset = o[1] || ''; this.hot.style.cursor = o[2] || ''; this.hot = null; } }
  stopPoint() { this.unhot(); try { if (this.over) document.removeEventListener('mouseover', this.over, true); if (this.click) document.removeEventListener('click', this.click, true); } catch (e) {} this.over = null; this.click = null; }
  renderVals() {
    const st = this.state || {};
    const isDemo = !this.props.embedded;
    const mode = st.mode || 'idle';
    const pub = !!st.pub;
    const info = this.pageInfo();
    const T = pub ? ['Something’s wrong', 'Broken link', 'Out of date', 'Hard to find', 'Other'] : ['Typo / wording', 'Outdated date or info', 'Broken link', 'New or replace photo', 'New or replace PDF', 'Something else'];
    const type = st.type || '';
    const urg = st.urg || 'This week';
    const chip = (on) => 'font-family:inherit;font-size:14px;font-weight:600;padding:8px 12px;border-radius:999px;cursor:pointer;border:2px solid ' + (on ? '#003366' : '#D6CEBD') + ';background:' + (on ? '#003366' : '#FFFFFF') + ';color:' + (on ? '#FFFFFF' : '#1F2933');
    const files = st.files || [];
    const tgt = st.target || { label: 'The whole page', section: info.title, path: 'page' };
    const can = !!(type && (st.text || '').trim().length > 3);
    const saveWho = (patch) => { const nw = Object.assign({ who: st.who || '', email: st.email || '' }, patch); try { window.localStorage.setItem('cpc-fix-who', JSON.stringify(nw)); } catch (e) {} this.setState(patch); };
    const stamp = new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    return {
      showDemo: isDemo, showBar: !isDemo && mode !== 'form' && mode !== 'sent',
      showPill: !isDemo && !!st.vol && mode === 'idle', pointing: mode === 'point',
      drawer: mode === 'form' || mode === 'sent', formOpen: mode === 'form', sent: mode === 'sent',
      volunteerForm: !pub,
      drawerTitle: pub ? 'Report a problem' : 'Fix this page',
      volunteerLabel: st.vol ? 'Turn off volunteer mode' : 'Turn on volunteer mode',
      volunteerNote: st.vol ? 'On in this browser for 90 days. Open any page in Play to see the tab.' : 'Off. Families never see the tab.',
      toggleVolunteer: () => this.toggleVol(),
      openPublic: () => { this.setState({ pub: true, mode: 'form', target: null, type: '', text: '' }); },
      startPoint: () => { this.setState({ pub: false, mode: 'point', target: null, type: '', text: '', files: [] }); this.startPointing(); },
      skipPoint: () => { this.stopPoint(); this.setState({ mode: 'form', target: null }); },
      repoint: () => { this.setState({ mode: 'point' }); this.startPointing(); },
      repointLabel: st.target ? 'Point at something else' : 'Point at a specific part',
      close: () => { this.stopPoint(); this.setState({ mode: 'idle', pub: false }); },
      again: () => { this.setState({ mode: pub ? 'form' : 'point', target: null, type: '', text: '', files: [] }); if (!pub) this.startPointing(); },
      targetLabel: tgt.label, targetSection: tgt.section, targetPath: tgt.path,
      types: T.map((l) => ({ label: l, on: type === l ? 'true' : 'false', style: chip(type === l), pick: () => this.setState({ type: l }) })),
      urg: ['Whenever', 'This week', 'Today: time-sensitive'].map((l) => ({ label: l, on: urg === l ? 'true' : 'false', style: chip(urg === l), pick: () => this.setState({ urg: l }) })),
      askLabel: pub ? 'What’s wrong?' : 'What should it say or do instead?',
      askHint: pub ? 'e.g. The registration link goes to an error page.' : 'e.g. Change “April 14” to “April 21”. Or: replace this photo with the attached one.',
      text: st.text || '', setText: (e) => this.setState({ text: e.target.value }),
      setFiles: (e) => this.setState({ files: Array.prototype.slice.call(e.target.files || []).map((f) => f.name) }),
      filesNote: files.length ? files.join(', ') : 'Photos, flyers or PDFs you want added. Webp and HEIC are fine.',
      who: st.who || '', email: st.email || '',
      setWho: (e) => saveWho({ who: e.target.value }), setEmail: (e) => saveWho({ email: e.target.value }),
      pageTitle: info.title, pageUrl: info.url || '(live page address)', stamp: stamp,
      cantSend: !can,
      sendStyle: 'font-family:inherit;font-size:16px;font-weight:700;padding:12px 20px;border-radius:6px;border:0;cursor:' + (can ? 'pointer' : 'not-allowed') + ';background:' + (can ? '#ce1126' : '#D6CEBD') + ';color:#FFFFFF',
      sendHint: can ? 'Goes to the website team for approval.' : 'Pick a type and describe the change.',
      submit: () => { if (!can) return; this.setState({ mode: 'sent', ticket: String(Math.floor(1000 + Math.random() * 9000)) }); },
      ticket: st.ticket || '',
      sentNote: pub ? 'Our team will take a look. Thanks for helping keep the site accurate.' : 'The website team reviews requests and approves them. You’ll get an email when the change is live.'
    };
  }
}

return Component;
});
DC.start("__page");
</script>

</body>
</html>
