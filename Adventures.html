<h1 style="font-size:clamp(46px,6.4vw,84px);line-height:1.02;font-weight:700;max-width:980px">Prepared for <span style="color:#FFFFFF;border-bottom:6px solid #ce1126">{{word}}</span>.</h1>
<p style="margin:0;font-size:22px;line-height:1.5;color:#D9E2EE;max-width:680px">Climb mountains. Raft rivers. Ride the range. Sail the beach. Nine Pacific Northwest camps and 2,000+ acres, open year-round, and every one built to send kids home more prepared than they came.</p>
<div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:6px"><a href="#finder" class="btn-red" style="background:#ce1126;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:17px;padding:15px 26px;border-radius:6px">Find your adventure</a><a href="SummerCamp.html" style="border:2px solid #FFFFFF;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:17px;padding:13px 24px;border-radius:6px">Summer camp 2026</a></div>

</div></div></section><section class="topo" style="background-color:#003366;color:#FFFFFF;"><div style="max-width:1240px;margin:0 auto;padding:72px 24px;display:flex;flex-direction:column;gap:24px"><h2 style="font-size:40px;color:#FFFFFF">The Cascade Pacific Council’s treasures</h2><p style="margin:0;font-size:18px;color:#D9E2EE;max-width:760px">Mountains, coast, high desert and river canyon, all within a few hours of Portland, and all here so kids can find out what they’re capable of.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:28px"><div style="display:flex;flex-direction:column;gap:6px;border-left:4px solid #ce1126;padding-left:16px"><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:44px;font-weight:700;line-height:1">9</span><span style="font-size:15px;color:#D9E2EE;line-height:1.4">camps and properties across the Pacific Northwest</span></div><div style="display:flex;flex-direction:column;gap:6px;border-left:4px solid #ce1126;padding-left:16px"><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:44px;font-weight:700;line-height:1">2,000+</span><span style="font-size:15px;color:#D9E2EE;line-height:1.4">private acres, open year-round</span></div><div style="display:flex;flex-direction:column;gap:6px;border-left:4px solid #ce1126;padding-left:16px"><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:44px;font-weight:700;line-height:1">16+ mi</span><span style="font-size:15px;color:#D9E2EE;line-height:1.4">of lake, river and Pacific Ocean shoreline</span></div><div style="display:flex;flex-direction:column;gap:6px;border-left:4px solid #ce1126;padding-left:16px"><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:44px;font-weight:700;line-height:1">60</span><span style="font-size:15px;color:#D9E2EE;line-height:1.4">horses in one of Scouting America’s largest herds</span></div></div></div></section><section><div style="max-width:1240px;margin:0 auto;padding:88px 24px;display:flex;flex-direction:column;gap:36px"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:48px;align-items:center">
<img class="ph" src="assets/53cb4789661ff71155c995b566417b53.jpg" alt="Scouts cheering at a Camp Pioneer campfire" style="aspect-ratio:16/10;border-radius:12px;box-shadow:-12px 12px 0 #D6CEBD">
<div style="display:flex;flex-direction:column;gap:18px"><div style="display:flex;flex-direction:column;gap:12px;max-width:780px"><span style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#ce1126"><svg width="16" height="16" viewBox="0 0 24 24" fill="#ce1126" aria-hidden="true"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.5l7.1-.6z"></path></svg>The promise</span><h2 style="font-size:46px;line-height:1.04;color:#003366">Why adventure?</h2></div>
<p style="margin:0;font-size:18px;line-height:1.65">Adventure isn’t the extra. It’s the curriculum. Out here, kids lead their patrol, cook for their friends, push through a hard climb and help someone else get up it too.</p>
<p style="margin:0;font-size:18px;line-height:1.65">That’s how confidence, teamwork and resilience get built, and why every trip ends the same way: a kid who’s a little more prepared for whatever comes next.</p>
<div style="display:flex;flex-wrap:wrap;gap:12px"><a href="index.html" class="btn-red" style="background:#ce1126;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:17px;padding:15px 26px;border-radius:6px">Join &amp; Be Prepared. For Life.<sup style="font-size:0.55em">®</sup></a><a href="SupportCamp.html" style="border:2px solid #003366;color:#003366;text-decoration:none;font-weight:700;font-size:16px;padding:12px 22px;border-radius:6px">Support camp</a></div></div></div></div></section><section class="topo" style="background-color:#D6CEBD"><div style="max-width:1100px;margin:0 auto;padding:64px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center">
<span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:18px;font-weight:700;color:#ce1126;letter-spacing:0.08em;text-transform:uppercase">Prepared. For Life.<sup style="font-size:0.55em">®</sup></span>
<p style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;margin:0;font-size:clamp(30px,3.6vw,46px);line-height:1.1;font-weight:700;text-transform:uppercase;color:#003366">Prepared for the summit, the surf,<br>the saddle and the snow.</p><p style="margin:0;font-size:18px;color:#1F2933;max-width:760px;text-align:center">Prepared. For Life. That’s the promise Scouting America has made to families for more than 100 years.</p></div></section><section class="topo" style="background-color:#003366;color:#FFFFFF;"><div style="max-width:1240px;margin:0 auto;padding:72px 24px;display:flex;flex-direction:column;gap:36px"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:36px"><div style="display:flex;flex-direction:column;gap:12px"><h3 style="font-size:26px;color:#FFFFFF">About the Cascade Pacific Council</h3><p style="margin:0;font-size:16px;line-height:1.55;color:#D9E2EE">We serve more than 7,000 kids and teens in 19 counties across Northwest Oregon and Southwest Washington.</p><a href="https://cpcscouting.org/contact" style="color:#FFFFFF;font-weight:700">Contact the CPC →</a></div><div style="display:flex;flex-direction:column;gap:12px"><h3 style="font-size:26px;color:#FFFFFF">Impact. For Generations.</h3><p style="margin:0;font-size:16px;line-height:1.55;color:#D9E2EE">Our goal: be the most impactful youth organization in the region, and a force for good in every community we serve.</p><a href="https://cpcscouting.org/donate" style="color:#FFFFFF;font-weight:700">Make your impact →</a></div><div style="display:flex;flex-direction:column;gap:12px"><h3 style="font-size:26px;color:#FFFFFF">Prepared. For Life.<sup style="font-size:0.55em">®</sup></h3><p style="margin:0;font-size:16px;line-height:1.55;color:#D9E2EE">For more than 100 years, Scouting America has made families one promise: their kids will be prepared.</p><a href="https://scouting.org" style="color:#FFFFFF;font-weight:700">Scouting America →</a></div></div></div></section>

<sc-if value="{{pointing}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position:fixed;left:16px;right:16px;top:16px;z-index:1000;margin:0 auto;max-width:720px;background:#003366;color:#FFFFFF;border-radius:12px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;box-shadow:0 10px 30px rgba(0,26,51,.35);animation:ftpIn .25s ease">
<span style="width:12px;height:12px;border-radius:50%;background:#ce1126;animation:ftpPulse 1.4s infinite;flex:none"></span>
<span style="font-weight:700;font-size:16px;flex:1 1 260px">Tap the part of the page that needs fixing.</span>
<button type="button" onClick="{{skipPoint}}" style="font-family:inherit;font-size:14px;font-weight:700;color:#003366;background:#FFFFFF;border:0;border-radius:6px;padding:8px 12px;cursor:pointer">Skip: it’s the whole page</button>
<button type="button" onClick="{{close}}" style="font-family:inherit;font-size:14px;font-weight:700;color:#FFFFFF;background:none;border:1px solid #FFFFFF;border-radius:6px;padding:7px 12px;cursor:pointer">Cancel</button>
</div>
</sc-if>

<sc-if value="{{drawer}}" hint-placeholder-val="{{ false }}">
<div onClick="{{close}}" style="position:fixed;inset:0;z-index:950;background:rgba(0,26,51,.25)"></div>
<aside class="ftp-drawer" role="dialog" aria-label="{{drawerTitle}}" style="position:fixed;left:0;top:0;bottom:0;z-index:1000;width:400px;max-width:100%;background:#FFFFFF;box-shadow:12px 0 40px rgba(0,26,51,.3);display:flex;flex-direction:column;animation:ftpIn .25s ease">
<div style="background:#003366;color:#FFFFFF;padding:18px 20px;display:flex;align-items:center;gap:12px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>

<button type="button" onClick="{{close}}" aria-label="Close" style="font-family:inherit;font-size:22px;line-height:1;color:#FFFFFF;background:none;border:0;cursor:pointer;padding:4px 6px">×</button>
</div>
<div style="height:4px;background:#ce1126"></div>

<sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
<div style="padding:28px 22px;display:flex;flex-direction:column;gap:14px">
<span style="width:56px;height:56px;border-radius:50%;background:#243E2C;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800">✓</span>
<span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:30px;font-weight:700;text-transform:uppercase;color:#003366;line-height:1.05">Thanks. It’s in the queue.</span>
<p style="margin:0;font-size:16px;line-height:1.55">{{sentNote}}</p>
<div style="background:#F4F1EA;border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.5;color:#515354">Request #{{ticket}} · {{pageTitle}}</div>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<button type="button" onClick="{{again}}" style="font-family:inherit;font-size:15px;font-weight:700;padding:12px 18px;border-radius:6px;border:0;cursor:pointer;background:#ce1126;color:#FFFFFF">Fix something else</button>
<button type="button" onClick="{{close}}" style="font-family:inherit;font-size:15px;font-weight:700;padding:10px 16px;border-radius:6px;border:2px solid #003366;cursor:pointer;background:#FFFFFF;color:#003366">Done</button>
</div>
</div>
</sc-if>

<sc-if value="{{formOpen}}" hint-placeholder-val="{{ true }}">
<div style="flex:1;overflow-y:auto;padding:20px 20px 8px;display:flex;flex-direction:column;gap:18px">

<div style="background:#F3F6FA;border:1px solid #9ab3d5;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px">
<span style="font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#003366">You pointed at</span>

<span style="font-size:13px;color:#515354">{{targetSection}}</span>
<button type="button" onClick="{{repoint}}" style="align-self:flex-start;font-family:inherit;font-size:13px;font-weight:700;color:#003366;background:none;border:0;padding:0;text-decoration:underline;cursor:pointer">{{repointLabel}}</button>
</div>

<div style="display:flex;flex-direction:column;gap:8px">

<div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{types}}" as="t" hint-placeholder-count="6"><button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">{{t.label}}</button></sc-for></div>
</div>

<textarea value="{{text}}" onChange="{{setText}}" rows="5" placeholder="{{askHint}}" style="font-family:inherit;font-size:15px;font-weight:400;color:#1F2933;border:1px solid #D6CEBD;border-radius:8px;padding:10px 12px;resize:vertical"></textarea>
</label>

<sc-if value="{{volunteerForm}}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-direction:column;gap:8px">
<span style="font-weight:700;color:#003366">How soon?</span>
<div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{urg}}" as="u" hint-placeholder-count="3"><button type="button" onClick="{{u.pick}}" aria-pressed="{{u.on}}" style="{{u.style}}">{{u.label}}</button></sc-for></div>
</div>
<label style="display:flex;flex-direction:column;gap:8px;font-weight:700;color:#003366">Attach photos or PDFs (optional)
<input type="file" multiple accept="image/*,.pdf,.webp,.heic" onChange="{{setFiles}}" style="font-family:inherit;font-size:14px;font-weight:400">
<span style="font-size:13px;font-weight:400;color:#515354">{{filesNote}}</span>
</label>
</sc-if>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:#003366">Your name<input type="text" value="{{who}}" onChange="{{setWho}}" style="font-family:inherit;font-size:15px;font-weight:400;border:1px solid #D6CEBD;border-radius:8px;padding:9px 10px"></label>
<label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:#003366">Email<input type="email" value="{{email}}" onChange="{{setEmail}}" style="font-family:inherit;font-size:15px;font-weight:400;border:1px solid #D6CEBD;border-radius:8px;padding:9px 10px"></label>
</div>

<details style="font-size:13px;color:#515354"><summary style="cursor:pointer;font-weight:700">Sent automatically with your request</summary>
<div style="padding-top:8px;display:flex;flex-direction:column;gap:3px;line-height:1.45"><span>Page: {{pageTitle}}</span><span>Address: {{pageUrl}}</span><span>Section: {{targetSection}}</span><span>Element: {{targetPath}}</span><span>Time: {{stamp}}</span></div>
</details>
</div>
<div style="border-top:1px solid #E4DED1;padding:14px 20px;display:flex;align-items:center;gap:12px">
<button type="button" onClick="{{submit}}" disabled="{{cantSend}}" style="{{sendStyle}}">Send request</button>
<span style="font-size:13px;color:#515354;flex:1">{{sendHint}}</span>
</div>
<sc-if value="{{volunteerForm}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{toggleVolunteer}}" style="font-family:inherit;font-size:12px;color:#515354;background:none;border:0;padding:0 20px 14px;text-align:left;text-decoration:underline;cursor:pointer">Turn off volunteer mode in this browser</button>
</sc-if>
</sc-if>
</aside>
</sc-if>

</div>
</template>
<script src="dc-lite.js"></script>
<script>
DC.register("__page", function () {

class Component extends DCLogic {
  componentDidMount() { this.timer = setInterval(() => { const s = this.state || {}; this.setState({ idx: ((s.idx || 0) + 1) % 4 }); }, 4500); }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const words = ['the summit', 'the surf', 'the saddle', 'the climb'];
    const alts = ['Scouts in front of Mount Jefferson at Camp Pioneer', 'Scouts land sailing on the beach at Camp Meriwether', 'Scouts on horseback at Camp Baldwin', 'Scouts rock climbing at Camp Baldwin'];
    const st = this.state || {};
    const idx = st.idx || 0, who = st.who || 'all', when = st.when || 'all';
    const CARDS = [{"title": "Summer Camp", "tag": "Cub Scouts · Scouts BSA · Rover", "desc": "A week at the Oregon Coast or high in the Cascades: four resident camps for every age, from Wild-West ranch to whitewater.", "pf": "independence", "href": "SummerCamp.dc.html", "cta": "Find your camp", "who": ["cub", "scouts", "older", "solo"], "when": ["summer"], "img": "assets/08ce0bb753932e486a9fab03e702a0e3.jpg", "alt": "Summer Camp"}, {"title": "Winter Camp", "tag": "Scouts BSA · Families", "desc": "Lodges near Mt. Hood’s slopes and heated cabins at Camp Baldwin. Snowshoes, sledding, snow shelters, then a warm fire.", "pf": "the cold", "href": "WinterCamp.dc.html", "cta": "Winter camping", "who": ["scouts", "older", "family"], "when": ["winter"], "img": "assets/34809a89f0ea596970678ee317369072.jpg", "alt": "Winter Camp"}, {"title": "Weekend Camping", "tag": "Every unit · Year-round", "desc": "Beaches, mountains and lakes on council land. Campsites are free for Friends of Scouting units.", "pf": "the first night out", "href": "WeekendCamping.dc.html", "cta": "Plan a weekend", "who": ["cub", "scouts", "older", "family"], "when": ["yearround", "summer", "winter"], "img": "assets/cdba8ab4885144d69c66c070b40b945f.jpg", "alt": "Weekend Camping"}, {"title": "Horse Adventures", "tag": "Grades 2–12 · Year-round", "desc": "One of Scouting America’s largest herds: Lil’ Buckaroos, trail rides and the 165-mile Horse Trek.", "pf": "the saddle", "href": "HorseAdventures.dc.html", "cta": "Ride with us", "who": ["cub", "scouts", "older"], "when": ["yearround", "summer"], "img": "assets/63d777530e46695f07d2288e2b3e5ab2.jpg", "alt": "Horse Adventures"}, {"title": "National Adventures", "tag": "Ages 13+", "desc": "Philmont, Northern Tier, Sea Base, Summit and Jamboree contingents, with the council behind you.", "pf": "the world", "href": "https://cpcscouting.org/upcoming-events/national-jamboree/", "cta": "National adventures", "who": ["older"], "when": ["summer"], "img": "assets/3c41a9e78dad230a29233445b043a35c.jpg", "alt": "National Adventures"}, {"title": "Facility Rentals", "tag": "Groups · Weddings · Retreats", "desc": "Reunions, retreats, trainings and weddings at idyllic Pacific Northwest properties.", "pf": "the big day", "href": "FacilityRentals.dc.html", "cta": "Take a tour", "who": ["family"], "when": ["yearround", "summer", "winter"], "img": "assets/552a18009225b7986c43f7d8817199af.jpg", "alt": "Facility Rentals"}, {"title": "Support Camp", "tag": "Volunteers · Donors", "desc": "Stewardship weekends, Campmasters and gifts that keep camp ready for the next Scout.", "pf": "giving back", "href": "SupportCamp.dc.html", "cta": "Get involved", "who": ["family", "scouts", "older"], "when": ["yearround", "summer", "winter"], "img": "assets/03701a0fbd64353cf6c1f968d18c1ad5.jpg", "alt": "Support Camp"}];
    const chipStyle = (on) => 'font-family:inherit;font-size:15px;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer;border:2px solid #003366;background:' + (on ? '#003366' : '#FFFFFF') + ';color:' + (on ? '#FFFFFF' : '#003366');
    const mk = (list, key, cur) => list.map(([v, l]) => ({ label: l, on: cur === v ? 'true' : 'false', style: chipStyle(cur === v), pick: () => this.setState({ [key]: v }) }));
    const shown = CARDS.filter((c) => (who === 'all' || c.who.indexOf(who) >= 0) && (when === 'all' || c.when.indexOf(when) >= 0));
    return {
      word: words[idx],
      heroes: words.map((w, i) => ({ cls: 'ah' + i, op: i === idx ? 1 : 0, alt: alts[i] })),
      whoChips: mk([['all', 'Everyone'], ['cub', 'Cub Scouts'], ['scouts', 'Scouts BSA'], ['older', 'Teens 13+'], ['solo', 'Individual Scouts'], ['family', 'Families & groups']], 'who', who),
      whenChips: mk([['all', 'Any time'], ['summer', 'Summer'], ['winter', 'Winter'], ['yearround', 'Year-round']], 'when', when),
      countText: shown.length + (shown.length === 1 ? ' adventure matches.' : ' adventures match.'),
      cards: shown.map((c) => Object.assign({}, c, { hasImg: !!c.img, noImg: !c.img }))
    };
  }
}

return Component;
});
DC.register("FixThisPage", function () {

class Component extends DCLogic {
  componentDidMount() {
    let vol = false;
    try {
      const q = new URLSearchParams(window.location.search);
      if (q.get('volunteer') === 'fix') window.localStorage.setItem('cpc-fix-volunteer', String(Date.now() + 90 * 864e5));
      if (q.get('volunteer') === 'off') window.localStorage.removeItem('cpc-fix-volunteer');
      const until = Number(window.localStorage.getItem('cpc-fix-volunteer') || 0);
      vol = until > Date.now();
      const saved = JSON.parse(window.localStorage.getItem('cpc-fix-who') || '{}');
      this.setState({ who: saved.who || '', email: saved.email || '' });
    } catch (e) {}
    this.setState({ vol: vol });
    this.onKey = (e) => { if (e.altKey && e.shiftKey && (e.key === 'E' || e.key === 'e' || e.code === 'KeyE')) { e.preventDefault(); this.toggleVol(); } };
    try { document.addEventListener('keydown', this.onKey); } catch (e) {}
  }
  componentWillUnmount() { this.stopPoint(); try { document.removeEventListener('keydown', this.onKey); } catch (e) {} }
  toggleVol() {
    const on = !(this.state && this.state.vol);
    try { if (on) window.localStorage.setItem('cpc-fix-volunteer', String(Date.now() + 90 * 864e5)); else window.localStorage.removeItem('cpc-fix-volunteer'); } catch (e) {}
    this.setState({ vol: on, mode: on ? (this.state.mode || 'idle') : 'idle' });
  }
  pageInfo() {
    let title = 'This page', url = '';
    try {
      const h1 = Array.prototype.find.call(document.querySelectorAll('h1'), (h) => !(h.closest && h.closest('[data-fix-ui]')));
      title = (h1 && h1.innerText.replace(/\s+/g, ' ').trim()) || document.title || title;
      url = window.location.href;
    } catch (e) {}
    return { title: title.slice(0, 90), url: url };
  }
  describe(el) {
    const txt = (el.getAttribute && (el.getAttribute('alt') || el.getAttribute('aria-label'))) || el.innerText || '';
    const kind = { IMG: 'Photo', A: 'Link', H1: 'Headline', H2: 'Heading', H3: 'Heading', LI: 'List item', P: 'Paragraph', BUTTON: 'Button', FIGURE: 'Photo', IFRAME: 'Embedded calendar/form' }[el.tagName] || 'Section';
    const t = txt.replace(/\s+/g, ' ').trim();
    let section = '';
    let s = el.closest ? el.closest('section') : null;
    if (s) { const h = s.querySelector('h1,h2'); if (h) section = 'In “' + h.innerText.replace(/\s+/g, ' ').trim().slice(0, 60) + '”'; }
    const path = [];
    let n = el;
    while (n && n.tagName && n.tagName !== 'BODY' && path.length < 4) { path.unshift(n.tagName.toLowerCase() + (n.id ? '#' + n.id : '')); n = n.parentElement; }
    return { label: kind + (t ? ': “' + t.slice(0, 80) + (t.length > 80 ? '…”' : '”') : ''), section: section || 'Main content', path: path.join(' > ') };
  }
  startPointing() {
    this.stopPoint();
    const pickable = 'img,figure,a,h1,h2,h3,li,p,button,iframe,code,section';
    this.over = (e) => {
      if (e.target.closest && e.target.closest('[data-fix-ui]')) return;
      const el = e.target.closest ? e.target.closest(pickable) : null;
      if (!el || el === this.hot) return;
      this.unhot();
      this.hot = el; this.hotOld = [el.style.outline, el.style.outlineOffset, el.style.cursor];
      el.style.outline = '3px solid #ce1126'; el.style.outlineOffset = '3px'; el.style.cursor = 'crosshair';
    };
    this.click = (e) => {
      if (e.target.closest && e.target.closest('[data-fix-ui]')) return;
      e.preventDefault(); e.stopPropagation();
      const el = (e.target.closest && e.target.closest(pickable)) || e.target;
      const d = this.describe(el);
      this.unhot(); this.stopPoint();
      this.setState({ mode: 'form', target: d });
    };
    try { document.addEventListener('mouseover', this.over, true); document.addEventListener('click', this.click, true); } catch (e) {}
  }
  unhot() { if (this.hot) { const o = this.hotOld || []; this.hot.style.outline = o[0] || ''; this.hot.style.outlineOffset = o[1] || ''; this.hot.style.cursor = o[2] || ''; this.hot = null; } }
  stopPoint() { this.unhot(); try { if (this.over) document.removeEventListener('mouseover', this.over, true); if (this.click) document.removeEventListener('click', this.click, true); } catch (e) {} this.over = null; this.click = null; }
  renderVals() {
    const st = this.state || {};
    const isDemo = !this.props.embedded;
    const mode = st.mode || 'idle';
    const pub = !!st.pub;
    const info = this.pageInfo();
    const T = pub ? ['Something’s wrong', 'Broken link', 'Out of date', 'Hard to find', 'Other'] : ['Typo / wording', 'Outdated date or info', 'Broken link', 'New or replace photo', 'New or replace PDF', 'Something else'];
    const type = st.type || '';
    const urg = st.urg || 'This week';
    const chip = (on) => 'font-family:inherit;font-size:14px;font-weight:600;padding:8px 12px;border-radius:999px;cursor:pointer;border:2px solid ' + (on ? '#003366' : '#D6CEBD') + ';background:' + (on ? '#003366' : '#FFFFFF') + ';color:' + (on ? '#FFFFFF' : '#1F2933');
    const files = st.files || [];
    const tgt = st.target || { label: 'The whole page', section: info.title, path: 'page' };
    const can = !!(type && (st.text || '').trim().length > 3);
    const saveWho = (patch) => { const nw = Object.assign({ who: st.who || '', email: st.email || '' }, patch); try { window.localStorage.setItem('cpc-fix-who', JSON.stringify(nw)); } catch (e) {} this.setState(patch); };
    const stamp = new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    return {
      showDemo: isDemo, showBar: !isDemo && mode !== 'form' && mode !== 'sent',
      showPill: !isDemo && !!st.vol && mode === 'idle', pointing: mode === 'point',
      drawer: mode === 'form' || mode === 'sent', formOpen: mode === 'form', sent: mode === 'sent',
      volunteerForm: !pub,
      drawerTitle: pub ? 'Report a problem' : 'Fix this page',
      volunteerLabel: st.vol ? 'Turn off volunteer mode' : 'Turn on volunteer mode',
      volunteerNote: st.vol ? 'On in this browser for 90 days. Open any page in Play to see the tab.' : 'Off. Families never see the tab.',
      toggleVolunteer: () => this.toggleVol(),
      openPublic: () => { this.setState({ pub: true, mode: 'form', target: null, type: '', text: '' }); },
      startPoint: () => { this.setState({ pub: false, mode: 'point', target: null, type: '', text: '', files: [] }); this.startPointing(); },
      skipPoint: () => { this.stopPoint(); this.setState({ mode: 'form', target: null }); },
      repoint: () => { this.setState({ mode: 'point' }); this.startPointing(); },
      repointLabel: st.target ? 'Point at something else' : 'Point at a specific part',
      close: () => { this.stopPoint(); this.setState({ mode: 'idle', pub: false }); },
      again: () => { this.setState({ mode: pub ? 'form' : 'point', target: null, type: '', text: '', files: [] }); if (!pub) this.startPointing(); },
      targetLabel: tgt.label, targetSection: tgt.section, targetPath: tgt.path,
      types: T.map((l) => ({ label: l, on: type === l ? 'true' : 'false', style: chip(type === l), pick: () => this.setState({ type: l }) })),
      urg: ['Whenever', 'This week', 'Today: time-sensitive'].map((l) => ({ label: l, on: urg === l ? 'true' : 'false', style: chip(urg === l), pick: () => this.setState({ urg: l }) })),
      askLabel: pub ? 'What’s wrong?' : 'What should it say or do instead?',
      askHint: pub ? 'e.g. The registration link goes to an error page.' : 'e.g. Change “April 14” to “April 21”. Or: replace this photo with the attached one.',
      text: st.text || '', setText: (e) => this.setState({ text: e.target.value }),
      setFiles: (e) => this.setState({ files: Array.prototype.slice.call(e.target.files || []).map((f) => f.name) }),
      filesNote: files.length ? files.join(', ') : 'Photos, flyers or PDFs you want added. Webp and HEIC are fine.',
      who: st.who || '', email: st.email || '',
      setWho: (e) => saveWho({ who: e.target.value }), setEmail: (e) => saveWho({ email: e.target.value }),
      pageTitle: info.title, pageUrl: info.url || '(live page address)', stamp: stamp,
      cantSend: !can,
      sendStyle: 'font-family:inherit;font-size:16px;font-weight:700;padding:12px 20px;border-radius:6px;border:0;cursor:' + (can ? 'pointer' : 'not-allowed') + ';background:' + (can ? '#ce1126' : '#D6CEBD') + ';color:#FFFFFF',
      sendHint: can ? 'Goes to the website team for approval.' : 'Pick a type and describe the change.',
      submit: () => { if (!can) return; this.setState({ mode: 'sent', ticket: String(Math.floor(1000 + Math.random() * 9000)) }); },
      ticket: st.ticket || '',
      sentNote: pub ? 'Our team will take a look. Thanks for helping keep the site accurate.' : 'The website team reviews requests and approves them. You’ll get an email when the change is live.'
    };
  }
}

return Component;
});
DC.start("__page");
</script>
