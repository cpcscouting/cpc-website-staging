<h1 style="font-size:clamp(42px,5.6vw,74px);line-height:1.02;font-weight:700;max-width:900px">Great futures don’t happen by accident.<br>Scouting builds them.</h1>
<p style="margin:0;font-size:21px;line-height:1.5;color:#D9E2EE;max-width:640px">One family. Thirty-eight years. From a Tiger Cub T-shirt in 1988 to an Eagle badge, and a mom who never stopped showing up. This is what your gift to Friends of Scouting makes possible.</p>
<div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:6px"><a href="https://cpcscouting.org/donate/" class="btn-red" style="background:#ce1126;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:17px;padding:15px 26px;border-radius:6px">Invest in their future</a><a href="#story" style="border:2px solid #FFFFFF;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:17px;padding:13px 24px;border-radius:6px">Read their story</a></div>
</div>

<div style="display:flex;flex-direction:column" aria-hidden="true"><span style="height:8px;background:#ce1126"></span><span style="height:5px;background:#FFFFFF"></span><span style="height:8px;background:#003366"></span></div><section><div style="max-width:1240px;margin:0 auto;padding:88px 24px;display:flex;flex-direction:column;gap:36px"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:48px;align-items:center">
<figure style="margin:0;display:flex;flex-direction:column;gap:10px"><img class="ph vint" src="assets/30b636aa59b75151ce252c616ca4b532.jpg" alt="Sharon in uniform beside her son Michael at his Eagle Scout court of honor" style="aspect-ratio:4/3;border-radius:12px;box-shadow:12px 12px 0 #D6CEBD"><figcaption style="font-size:14px;color:#515354;font-style:italic;padding-top:8px">Sharon and Michael at his Eagle Court of Honor.</figcaption></figure>
<div style="display:flex;flex-direction:column;gap:18px"><div style="display:flex;flex-direction:column;gap:12px;max-width:780px"><span style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#ce1126"><svg width="16" height="16" viewBox="0 0 24 24" fill="#ce1126" aria-hidden="true"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.5l7.1-.6z"></path></svg>The story</span><h2 style="font-size:46px;line-height:1.04;color:#003366">A mom, a Tiger Cub and a promise kept</h2></div>
<p style="margin:0;font-size:19px;line-height:1.65">In 1988, Sharon signed her son up for Tigers in Longview, Washington. She figured it would be a fun year.</p>
<p style="margin:0;font-size:19px;line-height:1.65">Michael went on to camp at Meriwether, Pioneer and Baldwin, travel to the National Jamboree, and earn the rank of Eagle Scout. Sharon never left. Decades later she is still in uniform, staffing day camps and recruiting tables, so other families get the same start hers did.</p>
<p style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;margin:0;font-size:28px;font-weight:700;text-transform:uppercase;color:#ce1126;line-height:1.1">That is Impact. For Generations.</p></div></div></div></section><section id="story" class="topo" style="background-color:#003366;color:#FFFFFF;"><div style="max-width:1240px;margin:0 auto;padding:88px 24px;display:flex;flex-direction:column;gap:24px"><div style="display:flex;flex-direction:column;gap:12px;max-width:780px"><span style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#FFFFFF"><svg width="16" height="16" viewBox="0 0 24 24" fill="#ce1126" aria-hidden="true"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.5l7.1-.6z"></path></svg>Then to now</span><h2 style="font-size:46px;line-height:1.04;color:#FFFFFF">38 years in 12 moments</h2><p style="margin:0;font-size:19px;line-height:1.55;color:#D9E2EE">Tap a year, or step through with Next. Every stop is part of what a Friend of Scouting keeps going.</p></div>

</div></div></div></section><section style="background-color:#F4F1EA;"><div style="max-width:1240px;margin:0 auto;padding:88px 24px;display:flex;flex-direction:column;gap:22px"><div style="display:flex;flex-direction:column;gap:12px;max-width:780px"><span style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#ce1126"><svg width="16" height="16" viewBox="0 0 24 24" fill="#ce1126" aria-hidden="true"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.5l7.1-.6z"></path></svg>Maintained camps</span><h2 style="font-size:46px;line-height:1.04;color:#003366">Same camps. New Scouts.</h2><p style="margin:0;font-size:19px;line-height:1.55;color:#515354">Donors kept these places ready for three decades. Flip between then and now.</p></div>

<figcaption style="position:absolute;left:24px;bottom:22px;display:flex;flex-direction:column;gap:4px;color:#FFFFFF"><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:64px;font-weight:700;line-height:.9;text-transform:uppercase">{{pairWhen}}</span><span style="font-size:18px;font-weight:600">{{pairCap}}</span></figcaption>
</figure></div></section><section class="topo" style="background-color:#003366;color:#FFFFFF;"><div style="max-width:1240px;margin:0 auto;padding:72px 24px;display:flex;flex-direction:column;gap:24px"><h2 style="font-size:40px;color:#FFFFFF">2025 community impact</h2><p style="margin:0;font-size:18px;color:#D9E2EE;max-width:760px">Service to our community is one of Scouting’s proudest achievements each year. Michael’s Eagle project was one; last year there were hundreds.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:28px"><div style="display:flex;flex-direction:column;gap:6px;border-left:4px solid #ce1126;padding-left:16px"><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:44px;font-weight:700;line-height:1">33,750</span><span style="font-size:15px;color:#D9E2EE;line-height:1.4">hours of Eagle project community service</span></div><div style="display:flex;flex-direction:column;gap:6px;border-left:4px solid #ce1126;padding-left:16px"><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:44px;font-weight:700;line-height:1">229</span><span style="font-size:15px;color:#D9E2EE;line-height:1.4">young people earned Eagle Scout</span></div><div style="display:flex;flex-direction:column;gap:6px;border-left:4px solid #ce1126;padding-left:16px"><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:44px;font-weight:700;line-height:1">4,800+</span><span style="font-size:15px;color:#D9E2EE;line-height:1.4">kids and teens at CPC summer camps (1,300+ K–5 and 3,500+ ages 11–18)</span></div><div style="display:flex;flex-direction:column;gap:6px;border-left:4px solid #ce1126;padding-left:16px"><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:44px;font-weight:700;line-height:1">94%</span><span style="font-size:15px;color:#D9E2EE;line-height:1.4">of Eagle Scouts say Scouting helped develop their character</span></div></div></div></section><section><div style="max-width:1240px;margin:0 auto;padding:56px 24px;display:flex;flex-direction:column;gap:14px"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px">
<div style="background:#FFFFFF;border:1px solid #E4DED1;border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:6px"><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:44px;font-weight:700;color:#ce1126;line-height:1">79%</span><span style="font-size:15px;line-height:1.45">of Cub Scout parents say Scouting encouraged their child to help others</span></div><div style="background:#FFFFFF;border:1px solid #E4DED1;border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:6px"><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:44px;font-weight:700;color:#ce1126;line-height:1">71%</span><span style="font-size:15px;line-height:1.45">of kids stay in Scouting year after year, like Michael did</span></div><div style="background:#FFFFFF;border:1px solid #E4DED1;border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:6px"><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:44px;font-weight:700;color:#ce1126;line-height:1">1:2</span><span style="font-size:15px;line-height:1.45">volunteer leaders to youth. Sharons, everywhere.</span></div><div style="background:#FFFFFF;border:1px solid #E4DED1;border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:6px"><span style="font-family:'Helvetica Neue LT Std','Roboto Condensed',Arial,sans-serif;font-size:44px;font-weight:700;color:#ce1126;line-height:1">85.7%</span><span style="font-size:15px;line-height:1.45">of every dollar goes to program support</span></div>
</div><p style="margin:0;font-size:13px;color:#515354">Source: Cascade Pacific Council 2025 Impact Report. <a href="https://cpcscouting.org/download/288/development/987510894/2025-cpc-annual-report-final">Download the report</a>.</p></div></section><section id="give"><div style="max-width:1240px;margin:0 auto;padding:88px 24px;display:flex;flex-direction:column;gap:22px"><div style="display:flex;flex-direction:column;gap:12px;max-width:780px"><span style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#ce1126"><svg width="16" height="16" viewBox="0 0 24 24" fill="#ce1126" aria-hidden="true"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.5l7.1-.6z"></path></svg>Invest in their future</span><h2 style="font-size:46px;line-height:1.04;color:#003366">Where your gift goes</h2><p style="margin:0;font-size:19px;line-height:1.55;color:#515354">Friends of Scouting gifts stay local, from Portland and Vancouver to the coast and the Cascades. Pick an area to see what it builds.</p></div>

<img class="ph" src="{{area.img}}" alt="{{area.t}}" style="aspect-ratio:3/2;border-radius:10px">
