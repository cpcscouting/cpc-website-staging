<h1 style="font-size:clamp(40px,5.6vw,72px);line-height:1.02;font-weight:700;max-width:820px">10 Essentials to Success</h1>
<p style="margin:0;font-size:21px;line-height:1.5;color:#E3EADF;max-width:640px">Build the team, handle the business, protect the leaders' time. Your job is to make sure the Cubmaster and den leaders never have to think about money, forms or logistics. You do that by building a team, not by doing it all yourself.</p>
<div style="display:flex;flex-wrap:wrap;gap:16px;margin-top:6px">
<a href="#essentials" class="btn-red" style="background:#ce1126;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:17px;padding:16px 28px;border-radius:6px">Start the checklist</a>

<p style="margin:0;font-size:18px;line-height:1.55;color:#515354">Check them off as you go. Tap "Add reminder" to put any of them on your calendar.</p>

DC.register("__page", function () {

class Component extends DCLogic {
  componentDidMount() {

  }
  save(done) {

    try { window.localStorage.setItem('cpc-10e-committee', JSON.stringify(done)); } catch (e) {}
  }
  renderVals() {
    const ITEMS = [{"t": "Complete Safeguarding Youth Training", "d": "Required before you register at my.Scouting.org, and it expires every 12 months. Put your renewal date on the calendar now.", "when": "First 30 days", "m": 0, "sec": "Section 2"}, {"t": "Register and get trained", "d": "Register as committee chair, get approved by the chartered organization, and finish the online pack committee training.", "when": "First 30 days", "m": 0, "sec": "Section 2"}, {"t": "Agree with the Cubmaster on who owns what", "d": "Program is theirs, business is yours. Write it down, and back each other in public.", "when": "First 30 days", "m": 0, "sec": "Sections 1–2"}, {"t": "Set your charter renewal reminder", "d": "Find your charter expiration date in the Unit Renewal portal and set a 75-day warning. Submit at least 15 days before it expires.", "when": "75 days before your date", "m": 0, "sec": "Section 9"}, {"t": "Build your committee team", "d": "Chair, secretary and treasurer at minimum, then the rest. Ask one person, in person, for one named job with the hours and an end date.", "when": "By August", "m": 8, "sec": "Section 3"}, {"t": "Run a 60-minute monthly parent and leader meeting", "d": "Week 4 of the cycle. Agenda out three days ahead, action items read back out loud, minutes out within 48 hours.", "when": "Every month", "m": 0, "sec": "Section 5"}, {"t": "Hold the annual program planning conference", "d": "Three hours in May with every leader. Set the dates, the budget, the event chairs and next year's recruiting list.", "when": "May", "m": 5, "sec": "Section 6"}, {"t": "Have Back to the Pack ready", "d": "Leaders in place and trained, the full-year calendar printed, and applications completed on site at fall recruiting night.", "when": "August", "m": 8, "sec": "Section 6"}, {"t": "Name one chair for every event", "d": "Derby, Blue and Gold, campouts, camp and the fundraiser each get a chair who isn't you or the Cubmaster. Hand them the playbook.", "when": "Before each event", "m": 10, "sec": "Section 6"}, {"t": "Keep money and records clean", "d": "Two signatures on every check, reimburse den leaders within two weeks, and pull the training report on the 1st of every month.", "when": "Every month", "m": 0, "sec": "Sections 7–8"}];
    const EVENTS = [{"name": "Safeguarding Youth Training (online, renews every 12 months)", "date": "Anytime at my.Scouting.org"}, {"name": "Pack Committee Position-Specific Training (online)", "date": "Anytime in the Learn Center"}, {"name": "District Roundtable", "date": "[Monthly · date and location]"}, {"name": "University of Scouting", "date": "[Date · location]"}, {"name": "Unit renewal window opens", "date": "60 days before your charter expires"}];
    const done = (this.state && this.state.done) || {};
    const pad = (n) => (n < 10 ? '0' : '') + n;
    const ymd = (d) => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
    const now = new Date();
    const items = ITEMS.map((it, i) => {
      let d;
      if (it.m > 0) { d = new Date(now.getFullYear(), it.m - 1, 1); if (d < now) d = new Date(now.getFullYear() + 1, it.m - 1, 1); }
      else { d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 7); }

    return { items: items, events: EVENTS, doneCount: c, pct: (c * 10) + '%', progressLabel: label, reset: () => this.save({}) };
  }
}

return Component;

DC.register("FixThisPage", function () {

class Component extends DCLogic {
  componentDidMount() {
    let vol = false;
    try {
      const q = new URLSearchParams(window.location.search);
      if (q.get('volunteer') === 'fix') window.localStorage.setItem('cpc-fix-volunteer', String(Date.now() + 90 * 864e5));
      if (q.get('volunteer') === 'off') window.localStorage.removeItem('cpc-fix-volunteer');
      const until = Number(window.localStorage.getItem('cpc-fix-volunteer') || 0);
      vol = until > Date.now();
      const saved = JSON.parse(window.localStorage.getItem('cpc-fix-who') || '{}');
      this.setState({ who: saved.who || '', email: saved.email || '' });
    } catch (e) {}
    this.setState({ vol: vol });
    this.onKey = (e) => { if (e.altKey && e.shiftKey && (e.key === 'E' || e.key === 'e' || e.code === 'KeyE')) { e.preventDefault(); this.toggleVol(); } };
    try { document.addEventListener('keydown', this.onKey); } catch (e) {}
  }
  componentWillUnmount() { this.stopPoint(); try { document.removeEventListener('keydown', this.onKey); } catch (e) {} }
  toggleVol() {
    const on = !(this.state && this.state.vol);
    try { if (on) window.localStorage.setItem('cpc-fix-volunteer', String(Date.now() + 90 * 864e5)); else window.localStorage.removeItem('cpc-fix-volunteer'); } catch (e) {}
    this.setState({ vol: on, mode: on ? (this.state.mode || 'idle') : 'idle' });
  }
  pageInfo() {
    let title = 'This page', url = '';
    try {
      const h1 = Array.prototype.find.call(document.querySelectorAll('h1'), (h) => !(h.closest && h.closest('[data-fix-ui]')));
      title = (h1 && h1.innerText.replace(/\s+/g, ' ').trim()) || document.title || title;
      url = window.location.href;
    } catch (e) {}
    return { title: title.slice(0, 90), url: url };
  }
  describe(el) {
